/* 两点之间是否没有墙（每 9px 采样） */
function losLine(x0, y0, x1, y1) {
  const dx = x1 - x0, dy = y1 - y0;
  const d = Math.hypot(dx, dy);
  const n = Math.floor(d / 9);
  for (let i = 1; i < n; i++) {
    const t = i / n;
    if (solidAt(x0 + dx * t, y0 + dy * t)) return false;
  }
  return true;
}

function nearestEnemy() {
  let best = null, bd = 1e9;
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    if (!e.alive) continue;
    const d = dist2(e.x, e.y, P.x, P.y);
    if (d >= bd) continue;
    if (!losLine(P.x, P.y, e.x, e.y)) continue;   // 隔墙不锁
    bd = d; best = e;
  }
  return best;
}

function cdOf(w) {
  const l = g.wlvl[w];
  let v = 1;
  switch (w) {
    case 0: v = 0.58 - 0.05 * l; break;
    case 1: v = 0.70 - 0.07 * l; break;
    case 2: v = 0.22; break;
    case 3: v = 2.35 - 0.28 * l; break;
    case 4: v = 1.55 - 0.16 * l; break;
    case 5: v = 0.92 - 0.10 * l; break;
    case 6: v = 1.05 - 0.11 * l; break;
    case 7: v = 1.10 - 0.09 * l; break;
    case 8: v = 0.74 - 0.05 * l; break;
    case 9: v = 1.85 - 0.20 * l; break;
    case 10: v = 1.60 - 0.12 * l; break;
    case 11: v = 0.95 - 0.08 * l; break;
    case 12: v = 3.40 - 0.25 * l; break;
    case 13: v = 0.95 - 0.06 * l; break;
    case 14: v = 1.25 - 0.09 * l; break;
    case 15: v = 99.0; break;
  }
  v = Math.max(0.16, v);
  if (g.wevo[w]) v *= 0.82;
  return v * g.cdMul;
}

/* 火 / 墨的池子 */
function umbR() {
  if (!g.wown[8]) return 0;
  return 52 + 5 * g.wlvl[8] + (g.wevo[8] ? 22 : 0);
}

function updateGuard(dt) {
  if (!g.wown[15]) return;
  const l = g.wlvl[15];
  const maxS = 2 + (l >= 4 ? 1 : 0) + (g.wevo[15] ? 1 : 0);
  if (g.shield >= maxS) { g.shieldT = 0; return; }
  g.shieldT -= dt;
  if (g.shieldT <= 0) {
    g.shield++;
    g.shieldT = g.wevo[15] ? 5.0 : 7.0;
    addRing(P.x, P.y, 26, "#7fd6c0", 0.25);
  }
}

function updateLamps(dt) {
  for (let i = lamps.length - 1; i >= 0; i--) {
    const m = lamps[i];
    m.life -= dt; m.tick -= dt;
    if (m.tick <= 0) {
      m.tick = 0.30;
      const r = m.r;
      for (const e of enemies) {
        if (!e.alive) continue;
        if (dist2(e.x, e.y, m.x, m.y) < (r + e.r) * (r + e.r)) {
          damageEnemy(e, m.dmg);
          addParts(e.x, e.y, 2, "#f2a761", 60, 2);
        }
      }
      if (m.evo && dist2(P.x, P.y, m.x, m.y) < (r + P.r) * (r + P.r) && g.hp < g.hp0) {
        g.hp += 1;
        addFloat(P.x, P.y - 16, "+1", "#8fc46a");
      }
    }
    if (m.life <= 0) lamps.splice(i, 1);
  }
}

function addZone(x, y, r, life, kind) {
  if (zones.length > 26) zones.shift();
  zones.push({ x, y, r, life, max: life, kind, tick: 0 });
}

function knockBack(e, fromX, fromY, power) {
  const dx = e.x - fromX, dy = e.y - fromY;
  const d = Math.hypot(dx, dy) || 1;
  const nx = e.x + dx / d * power, ny = e.y + dy / d * power;
  if (!solidAt(nx, e.y)) e.x = nx;
  if (!solidAt(e.x, ny)) e.y = ny;
}

function fireWeapon(w) {
  const l = g.wlvl[w];
  const evo = g.wevo[w];
  const tgt = nearestEnemy();

  if (w === 0) {                                   // 剑光 / 月华斩：正面斩击
    let ang = P.ang;
    if (tgt) ang = Math.atan2(tgt.y - P.y, tgt.x - P.x);
    const reach = (84 + 8 * l) * (evo ? 1.25 : 1);
    const cone = evo ? 1.05 : 0.80;
    const dmg = 10 + 7 * l;
    slashes.push({ x: P.x, y: P.y, ang, reach, cone, life: 0.23, max: 0.23, evo, type: "steel" });
    if (evo) {
      slashes.push({ x: P.x, y: P.y, ang: ang - 0.45, reach: reach * 0.92, cone: 0.62, life: 0.23, max: 0.23, evo, type: "steel" });
      slashes.push({ x: P.x, y: P.y, ang: ang + 0.45, reach: reach * 0.92, cone: 0.62, life: 0.23, max: 0.23, evo, type: "steel" });
    }
    for (const e of enemies) {
      if (!e.alive) continue;
      const d = Math.hypot(e.x - P.x, e.y - P.y);
      if (d > reach + e.r) continue;
      let da = Math.atan2(e.y - P.y, e.x - P.x) - ang;
      while (da > Math.PI) da -= TAU;
      while (da < -Math.PI) da += TAU;
      if (Math.abs(da) <= cone) {
        damageEnemy(e, dmg);
        knockBack(e, P.x, P.y, evo ? 26 : 20);
        addParts(e.x, e.y, 4, "#e6f4ff", 90, 2);
      }
    }
    sfx("swing");
    return;
  }

  if (w === 1) {                                   // 铜钱镖 / 万钱阵
    const n = 1 + Math.floor(l / 2) + (evo ? 4 : 0);
    const base = tgt ? Math.atan2(tgt.y - P.y, tgt.x - P.x) : P.ang;
    const dmg = 8 + 5 * l;
    for (let i = 0; i < n; i++) {
      const spread = n === 1 ? 0 : (i - (n - 1) / 2) * (evo ? 0.34 : 0.18);
      const a = base + spread;
      bullets.push({
        x: P.x + Math.cos(a) * 12, y: P.y + Math.sin(a) * 12,
        vx: Math.cos(a) * 430, vy: Math.sin(a) * 430,
        kind: 0, dmg, pierce: 1 + Math.floor(l / 2) + (evo ? 3 : 0),
        life: 1.1, evo, r: 4, bounce: evo ? 5 : (l >= 5 ? 3 : 2),
      });
    }
    sfx("coin");
    return;
  }

  if (w === 3) {                                   // 长明灯 / 灯王长明
    const r = (80 + 10 * l) * (evo ? 1.35 : 1);
    addRing(P.x, P.y, r, "#f2a761", 0.42);
    pulses.push({ x: P.x, y: P.y, r: r, col: "#f2a761", life: 0.42, max: 0.42, kind: "fill" });
    const dmg = 14 + 6 * l;
    let hit = 0;
    for (const e of enemies) {
      if (!e.alive) continue;
      if (dist2(e.x, e.y, P.x, P.y) < (r + e.r) * (r + e.r)) { damageEnemy(e, dmg); hit++; }
    }
    if (evo && hit) {
      g.hp = Math.min(g.hp0, g.hp + 2);
      addFloat(P.x, P.y - 16, "+2", "#8fc46a");
    }
    sfx("lamp");
    return;
  }

  if (w === 4) {                                   // 铜铃 / 钟鸣不止
    const r = 62 + 9 * l;
    const dmg = 4 + 2 * l;
    const slowMul = evo ? 0.30 : 0.52;
    addRing(P.x, P.y, r, "#c6d2de", 0.38);
    for (const e of enemies) {
      if (!e.alive) continue;
      if (dist2(e.x, e.y, P.x, P.y) < (r + e.r) * (r + e.r)) {
        damageEnemy(e, dmg);
        e.slow = 2.2; e.slowmul = slowMul;
      }
    }
    sfx("bell");
    return;
  }

  if (w === 5) {                                   // 纸鹤 / 群鹤归巢
    const n = evo ? 3 : 1;
    const dmg = 9 + 4 * l;
    for (let i = 0; i < n; i++) {
      const a = (tgt ? Math.atan2(tgt.y - P.y, tgt.x - P.x) : P.ang) + (i - (n - 1) / 2) * 0.5;
      bullets.push({
        x: P.x + Math.cos(a) * 10, y: P.y + Math.sin(a) * 10,
        vx: Math.cos(a) * 250, vy: Math.sin(a) * 250,
        kind: 2, dmg, pierce: 1, life: 3.2, evo, r: 5,
        homing: true, turn: 520,
      });
    }
    sfx("crane");
    return;
  }

  if (w === 6) {                                   // 墨滴 / 泼墨成山
    const a = tgt ? Math.atan2(tgt.y - P.y, tgt.x - P.x) : P.ang;
    bullets.push({
      x: P.x + Math.cos(a) * 12, y: P.y + Math.sin(a) * 12,
      vx: Math.cos(a) * 300, vy: Math.sin(a) * 300,
      kind: 3, dmg: 12 + 6 * l, pierce: 1, life: 1.4, evo,
      r: 5, splash: 30 + 4 * l,
    });
    sfx("ink");
    return;
  }

  if (w === 7) {                                   // 火折子 / 燎原火
    const a = tgt ? Math.atan2(tgt.y - P.y, tgt.x - P.x) : P.ang;
    bullets.push({
      x: P.x + Math.cos(a) * 10, y: P.y + Math.sin(a) * 10,
      vx: Math.cos(a) * 330, vy: Math.sin(a) * 330,
      kind: 5, dmg: 7 + 4 * l, pierce: evo ? 2 : 1, life: 1.2, evo, r: 6,
      burn: 26 + 4 * l,
    });
    sfx("fire");
    return;
  }

  if (w === 8) {                                   // 纸伞 / 风雨不透
    const reach = 44 + 4 * l + (evo ? 20 : 0);
    const dmg = 6 + 3 * l;
    slashes.push({ x: P.x, y: P.y, ang: 0, reach, cone: Math.PI + 0.2, life: 0.24, max: 0.24, evo, full: true });
    for (const e of enemies) {
      if (!e.alive) continue;
      if (dist2(e.x, e.y, P.x, P.y) < (reach + e.r) * (reach + e.r)) {
        damageEnemy(e, dmg);
        knockBack(e, P.x, P.y, evo ? 26 : 16);
        if (evo) { e.slow = 0.8; e.slowmul = 0.75; }
      }
    }
    if (evo) addRing(P.x, P.y, reach, "#cfa89a", 0.3);
    sfx("swing");
    return;
  }

  if (w === 9) {                                   // 铜锣 / 锣鼓喧天
    const r = 60 + 9 * l;
    const dmg = 12 + 6 * l;
    waves.push({ x: P.x, y: P.y, r: 16, max: r, speed: r / 0.36, life: 0.36, maxLife: 0.36, dmg, hitSet: [], evo });
    if (evo) waves.push({ x: P.x, y: P.y, r: 16, max: r * 1.18, speed: r * 1.18 / 0.44, life: 0.44, maxLife: 0.44, dmg: dmg * 0.8, hitSet: [], evo });
    sfx("gong");
    return;
  }

  if (w === 10) {                                  // 墨池 / 砚海无涯
    let x = P.x, y = P.y;
    if (tgt) { x = tgt.x; y = tgt.y; }
    const r = (58 + 6 * l) * (evo ? 1.26 : 1);
    addZone(x, y, r, evo ? 6.5 : 4.5, "ink");
    zones[zones.length - 1].dmg = 5 + 3 * l;
    addRing(x, y, r, "#5a6d86", 0.3);
    sfx("pool");
    return;
  }

  if (w === 11) {                                  // 针雨 / 千针落
    const n = 5 + 2 * l + (evo ? 5 : 0);
    const dmg = 7 + 3 * l;
    for (let i = 0; i < n; i++) {
      let tx, ty;
      if (evo) {
        tx = rnd(TS, WT * TS - TS); ty = rnd(TS, HT * TS - TS);
      } else {
        const base = tgt ? tgt : { x: P.x, y: P.y };
        tx = clamp(base.x + rnd(-46, 46), TS, WT * TS - TS);
        ty = clamp(base.y + rnd(-46, 46), TS, HT * TS - TS);
      }
      bullets.push({
        x: tx, y: ty - 150 - rnd(0, 60), vx: 0, vy: 540, kind: 6,
        dmg, pierce: 2, life: 0.55, evo, r: 3,
      });
    }
    sfx("needle");
    return;
  }

  if (w === 12) {                                  // 灯笼：插地成一盏灯
    lamps.push({
      x: P.x, y: P.y, life: 5 + (evo ? 2 : 0), tick: 0,
      r: 64 + 6 * l + (evo ? 18 : 0), dmg: 6 + 3 * l, evo,
    });
    if (lamps.length > 6) lamps.shift();
    sfx("lantern");
    return;
  }

  if (w === 13) {                                  // 吸血刀 / 血河斩：一记大横斩
    let ang = P.ang;
    if (tgt) ang = Math.atan2(tgt.y - P.y, tgt.x - P.x);
    const reach = 70 + 7 * l + (evo ? 18 : 0);
    const cone = evo ? 1.65 : 1.25;
    const dmg = 12 + 7 * l;
    let heal = 0;
    for (const e of enemies) {
      if (!e.alive) continue;
      const d = Math.hypot(e.x - P.x, e.y - P.y);
      if (d > reach + e.r) continue;
      let da = Math.atan2(e.y - P.y, e.x - P.x) - ang;
      while (da > Math.PI) da -= TAU;
      while (da < -Math.PI) da += TAU;
      if (Math.abs(da) <= cone) {
        damageEnemy(e, dmg);
        knockBack(e, P.x, P.y, 16);
        heal += dmg * (evo ? 0.34 : 0.20);
        addParts(e.x, e.y, 6, "#ff4050", 110, 2);
      }
    }
    if (heal >= 1) {
      const add = Math.floor(heal);
      g.hp = Math.min(g.hp0, g.hp + add);
      addFloat(P.x, P.y - 20, "+" + add, "#8fc46a");
    }
    slashes.push({ x: P.x, y: P.y, ang, reach, cone, life: 0.26, max: 0.26, evo, type: "blood" });
    sfx("swing");
    return;
  }

  if (w === 14) {                                  // 火铳：一蓬铁砂
    const n = 2 + Math.floor(l / 2) + (evo ? 2 : 0);
    const base = tgt ? Math.atan2(tgt.y - P.y, tgt.x - P.x) : P.ang;
    const dmg = 6 + 3 * l;
    for (let i = 0; i < n; i++) {
      const a = base + (n === 1 ? 0 : (i - (n - 1) / 2) * 0.16) + rnd(-0.06, 0.06);
      bullets.push({
        x: P.x + Math.cos(a) * 10, y: P.y + Math.sin(a) * 10,
        vx: Math.cos(a) * 360, vy: Math.sin(a) * 360,
        kind: 7, dmg, pierce: evo ? 3 : 2, life: 0.6, evo, r: 4,
      });
    }
    g.shake = Math.max(g.shake, 0.25);
    sfx("swing");
    return;
  }

  if (w === 15) {                                  // 护心镜：被动，不出手
    return;
  }
}

/* ---------- 符纸环绕 ---------- */
function updateOrbit(dt) {
  const w = 2;
  if (!g.wown[w]) return;
  const l = g.wlvl[w];
  const evo = g.wevo[w];
  g.orb += dt * (1.9 + 0.12 * l) * (evo ? 1.35 : 1);
  const count = 2 + l + (evo ? 3 : 0);
  const rad = 44 + l * 2;
  g.talTick -= dt;
  const tickGap = evo ? 0.13 : 0.22;
  if (g.talTick <= 0) {
    g.talTick = tickGap;
    const dmg = 6 + 3 * l;
    for (let i = 0; i < count; i++) {
      const a = g.orb + i * TAU / count;
      const ox = P.x + Math.cos(a) * rad, oy = P.y + Math.sin(a) * rad;
      let hit = false;
      for (const e of enemies) {
        if (!e.alive) continue;
        if (dist2(e.x, e.y, ox, oy) < (e.r + 13) * (e.r + 13)) { damageEnemy(e, dmg); hit = true; }
      }
      if (hit) addParts(ox, oy, 3, "#c0a2f0", 70, 2);
    }
    sfx("talisman");
  }
}

/* ---------- 灯笼随从 ---------- */
function updateMinions(dt) {
  const w = 12;
  const want = g.wown[w] ? (1 + Math.floor(g.wlvl[w] / 2) + (g.wevo[w] ? 2 : 0)) : 0;
  while (minions.length > want) minions.pop();
  const l = g.wlvl[w], evo = g.wevo[w];
  const dmg = 8 + 3 * l;
  while (minions.length < want) {
    minions.push({ ang: rnd(0, TAU), dist: 52, cd: 0, r: 7 });
    sfx("lantern");
  }
  for (let i = 0; i < minions.length; i++) {
    const m = minions[i];
    m.ang += dt * 2.2;
    const tx = P.x + Math.cos(m.ang + i * TAU / Math.max(1, minions.length)) * m.dist;
    const ty = P.y + Math.sin(m.ang + i * TAU / Math.max(1, minions.length)) * m.dist;
    m.x = m.x == null ? tx : lerp(m.x, tx, Math.min(1, dt * 8));
    m.y = m.y == null ? ty : lerp(m.y, ty, Math.min(1, dt * 8));
    m.cd -= dt;
    if (m.cd <= 0) {
      for (const e of enemies) {
        if (!e.alive) continue;
        if (dist2(e.x, e.y, m.x, m.y) < (e.r + m.r + 4) * (e.r + m.r + 4)) {
          damageEnemy(e, dmg);
          addParts(m.x, m.y, 4, evo ? "#f0cf7a" : "#f2c46a", 70, 2);
          m.cd = 0.55;
          break;
        }
      }
    }
  }
}

/* ---------- 池子伤害 ---------- */
function updateZones(dt) {
  for (let i = zones.length - 1; i >= 0; i--) {
    const z = zones[i];
    z.life -= dt;
    z.tick -= dt;
    if (z.tick <= 0) {
      z.tick = 0.42;
      for (const e of enemies) {
        if (!e.alive) continue;
        if (dist2(e.x, e.y, z.x, z.y) < (z.r + e.r) * (z.r + e.r)) {
          damageEnemy(e, z.dmg != null ? z.dmg : (z.kind === "ink" ? 4 + 2 * g.wlvl[10] : 5 + 2 * g.wlvl[7]));
          if (z.kind === "ink") { e.slow = 1.1; e.slowmul = 0.45; }
        }
      }
    }
    if (z.life <= 0) zones.splice(i, 1);
  }
}

/* ---------- 声波 ---------- */
function updateWaves(dt) {
  for (let i = waves.length - 1; i >= 0; i--) {
    const w = waves[i];
    w.life -= dt;
    w.r = Math.min(w.max, w.r + w.speed * dt);
    for (const e of enemies) {
      if (!e.alive) continue;
      if (w.hitSet.indexOf(e) >= 0) continue;
      const d = Math.hypot(e.x - w.x, e.y - w.y);
      if (d < w.r + e.r && d > w.r - 26 - e.r) {
        w.hitSet.push(e);
        damageEnemy(e, w.dmg);
        knockBack(e, w.x, w.y, w.evo ? 24 : 14);
        if (w.evo) { e.slow = 1.2; e.slowmul = 0.4; }
      }
    }
    if (w.life <= 0) waves.splice(i, 1);
  }
}

/* ---------- 子弹更新 ---------- */
function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    if (b.homing) {
      let tgt = null, bd = 1e9;
      for (const e of enemies) {
        if (!e.alive) continue;
        const d = dist2(e.x, e.y, b.x, b.y);
        if (d < bd) { bd = d; tgt = e; }
      }
      if (tgt) {
        const want = Math.atan2(tgt.y - b.y, tgt.x - b.x);
        let cur = Math.atan2(b.vy, b.vx);
        let da = want - cur;
        while (da > Math.PI) da -= TAU;
        while (da < -Math.PI) da += TAU;
        const turn = b.turn * dt / 250;
        cur += clamp(da, -turn, turn);
        const sp = Math.hypot(b.vx, b.vy);
        b.vx = Math.cos(cur) * sp; b.vy = Math.sin(cur) * sp;
      }
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.life -= dt;

    if (b.kind !== 6 && solidAt(b.x, b.y)) {
      if (b.kind === 0 && (b.bounce || 0) > 0) {
        let rev = false;
        if (!solidAt(b.x - b.vx * dt, b.y)) { b.vx = -b.vx; rev = true; }
        else if (!solidAt(b.x, b.y - b.vy * dt)) { b.vy = -b.vy; rev = true; }
        if (rev) {
          b.x += b.vx * dt; b.y += b.vy * dt;
          b.bounce--; b.life -= 0.10;
          addParts(b.x, b.y, 5, "#ffd880", 80, 2);
          continue;
        }
      }
      if (b.kind === 3) splashInk(b);
      if (b.kind === 5) explosion(b, false);
      addParts(b.x, b.y, 4, "#cbbda0", 60, 2);
      bullets.splice(i, 1);
      continue;
    }

    let hitIdx = -1;
    for (let k = 0; k < enemies.length; k++) {
      const e = enemies[k];
      if (!e.alive) continue;
      const rr = e.r + b.r;
      if (dist2(e.x, e.y, b.x, b.y) < rr * rr) { hitIdx = k; break; }
    }
    if (hitIdx >= 0) {
      const e = enemies[hitIdx];
      damageEnemy(e, b.dmg);
      if (b.kind === 3) splashInk(b);
      if (b.kind === 5) explosion(b, b.evo);
      if (b.kind === 2 && b.evo) addParts(b.x, b.y, 8, "#f0e6d0", 90, 2);
      b.pierce--;
      if (b.pierce <= 0 || b.kind === 3 || b.kind === 5) {
        bullets.splice(i, 1);
        continue;
      }
    }
    if (b.life <= 0) {
      if (b.kind === 3) splashInk(b);
      if (b.kind === 5) explosion(b, b.evo);
      bullets.splice(i, 1);
    }
  }

  // 敌人打出的暗器
  for (let i = ebullets.length - 1; i >= 0; i--) {
    const b = ebullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.life -= dt;
    if (b.life <= 0 || solidAt(b.x, b.y)) { ebullets.splice(i, 1); continue; }
    if (g.wown[8]) {
      const R = umbR();
      if (dist2(b.x, b.y, P.x, P.y) < (R + b.r) * (R + b.r)) {
        addParts(b.x, b.y, 5, "#e6d3b0", 70, 2);
        ebullets.splice(i, 1);
        continue;
      }
    }
    if (g.iframe <= 0 && dist2(b.x, b.y, P.x, P.y) < (P.r + b.r) * (P.r + b.r)) {
      hurtPlayer(b.dmg);
      ebullets.splice(i, 1);
    }
  }
}

function explosion(b, evo) {
  addRing(b.x, b.y, 26, "#e8703a", 0.25);
  pulses.push({ x: b.x, y: b.y, r: 30, col: "#e8703a", life: 0.25, max: 0.25, kind: "fill" });
  addParts(b.x, b.y, 10, "#ff9a4a", 130, 3);
  const r = 26 + (evo ? 10 : 0);
  for (const e of enemies) {
    if (!e.alive) continue;
    if (dist2(e.x, e.y, b.x, b.y) < (r + e.r) * (r + e.r)) damageEnemy(e, b.dmg * 0.5);
  }
  addZone(b.x, b.y, r * 0.9 + 12, evo ? 4.2 : 3.0, "fire");
  sfx("fire");
}

function splashInk(b) {
  const r = b.splash;
  addRing(b.x, b.y, r, "#7a90b0", 0.3);
  pulses.push({ x: b.x, y: b.y, r, col: "#3b4a5e", life: 0.3, max: 0.3, kind: "fill" });
  for (const e of enemies) {
    if (!e.alive) continue;
    if (dist2(e.x, e.y, b.x, b.y) < (r + e.r) * (r + e.r)) damageEnemy(e, b.dmg * 0.7);
  }
  addParts(b.x, b.y, 10, "#4a5a70", 110, 3);
}

/* ---------- 受伤 ---------- */
function hurtPlayer(dmg) {
  if (g.wown[8]) dmg = Math.max(1, Math.round(dmg * 0.75));
  if (g.shield > 0) {
    g.shield--;
    g.iframe = 0.75;
    g.shake = 0.4;
    addFloat(P.x, P.y - 20, "挡", "#7fd6c0");
    addParts(P.x, P.y, 14, "#7fd6c0", 120, 3);
    addRing(P.x, P.y, 30, "#7fd6c0", 0.3);
    sfx("coin");
    return;
  }
  g.hp -= dmg;
  g.iframe = 0.55;
  g.shake = 0.5;
  g.flash = 0.35;
  addFloat(P.x, P.y - 18, "-" + dmg, "#e05a4a");
  addParts(P.x, P.y, 12, "#c0392b", 130, 3);
  sfx("hurt");
  if (g.hp <= 0) { g.hp = 0; g.state = "dead"; sfx("die"); }
}

/* ---------- 敌人更新 ---------- */
function updateEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (!e.alive) { enemies.splice(i, 1); continue; }
    if (e.slow > 0) { e.slow -= dt; if (e.slow <= 0) e.slowmul = 1; }
    const sp = e.spd * (e.slow > 0 ? e.slowmul : 1) * (g.fog > 0 && e.type !== 9 ? 1.15 : 1) * (e.frenzy ? 1.25 : 1);
    const dx = P.x - e.x, dy = P.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    let vx = dx / d * sp, vy = dy / d * sp;

    // 术士：保持距离并放暗器
    if (e.type === 7) {
      const want = 150;
      if (d < want - 20) { vx = -vx; vy = -vy; }
      else if (d < want + 40) { vx *= 0.2; vy *= 0.2; }
      e.cd = (e.cd || 0) - dt;
      if (e.cd <= 0 && d < 320) {
        e.cd = 2.2;
        const a = Math.atan2(P.y - e.y, P.x - e.x);
        ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 210, vy: Math.sin(a) * 210, dmg: e.dmg, r: 4, life: 2.2, kind: "bone" });
      }
    }

    // 轻微分离
    for (let k = 0; k < enemies.length; k += 6) {
      const o = enemies[k];
      if (o === e || !o.alive) continue;
      const sx = e.x - o.x, sy = e.y - o.y;
      const sd = Math.hypot(sx, sy);
      if (sd > 0.1 && sd < e.r + o.r) { vx += sx / sd * 40; vy += sy / sd * 40; }
    }
    // 前面挡墙就顺着流场绕，别卡在墙角
    if (e.type !== 9 && (solidAt(e.x + vx * dt * 4, e.y) || solidAt(e.x, e.y + vy * dt * 4))) {
      const fd = flowDir(e.x, e.y);
      if (fd) { vx = fd.x * sp; vy = fd.y * sp; }
    }
    const nx = e.x + vx * dt, ny = e.y + vy * dt;
    if (e.type === 9) { e.x = nx; e.y = ny; }        // 幽灵穿墙
    else {
      if (!solidAt(nx, e.y)) e.x = nx;
      if (!solidAt(e.x, ny)) e.y = ny;
    }
    e.wob += dt * 3;

    // 撞到玩家
    if (g.iframe <= 0 && dist2(e.x, e.y, P.x, P.y) < (e.r + P.r) * (e.r + P.r)
        && (e.type === 9 || losLine(e.x, e.y, P.x, P.y))) {
      if (e.type === 6) {                            // 自爆
        e.alive = false;
        addParts(e.x, e.y, 22, "#e8703a", 190, 4);
        addRing(e.x, e.y, 52, "#ff8a3a", 0.4);
        hurtPlayer(e.dmg);
        for (const o of enemies) if (o.alive && o !== e && dist2(o.x, o.y, e.x, e.y) < 70 * 70) damageEnemy(o, 20);
        continue;
      }
      hurtPlayer(e.dmg);
      knockBack(e, P.x, P.y, 22);
      if (g.state !== "play") return;
    }
  }
}

/* ---------- 拾取 / 升级 ---------- */
function updatePickups(dt) {
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    p.life -= dt;
    if (p.life <= 0) { pickups.splice(i, 1); continue; }
    const d = Math.hypot(P.x - p.x, P.y - p.y);
    if (d < g.magnet) {
      const sp = 260 * (1 - d / g.magnet) + 60;
      p.x += (P.x - p.x) / d * sp * dt;
      p.y += (P.y - p.y) / d * sp * dt;
    }
    if (d < P.r + 8) {
      g.xp += (p.xp || 0) * g.xpMul;
      if (p.kind === "chest") {
        g.hp = Math.min(g.hp0, g.hp + 30);
        addFloat(P.x, P.y - 20, "+30", "#8fc46a", true);
        g.flash = 0.3;
        sfx("level");
      } else sfx("pick");
      addParts(p.x, p.y, 4, p.kind === "chest" ? "#f0cf7a" : "#6fbfcf", 80, 2);
      pickups.splice(i, 1);
      checkLevel();
    }
  }
}

function checkLevel() {
  while (g.xp >= g.xpneed) {
    g.xp -= g.xpneed;
    g.level++;
    g.xpneed = 3 + g.level * 2;
    g.hp = Math.min(g.hp0, g.hp + 4);
    buildCards();
    g.state = "level";
    g.chs = 0;
    sfx("level");
    break;
  }
}

function buildCards() {
  const pool = [];
  for (let w = 0; w < WP_COUNT; w++) if (g.wown[w] && g.wlvl[w] >= 5 && !g.wevo[w]) pool.push({ k: "evo", w, weight: 3 });
  for (let w = 0; w < WP_COUNT; w++) if (!g.wown[w]) pool.push({ k: "new", w, weight: 3 });
  for (let w = 0; w < WP_COUNT; w++) if (g.wown[w] && g.wlvl[w] < 5) pool.push({ k: "up", w, weight: 2 });
  for (let s = 0; s < ATTRS.length; s++) pool.push({ k: "attr", s, weight: 1 });

  const picked = [];
  const evoItem = pool.find(o => o.k === "evo");
  if (evoItem && picked.length < 1) picked.push(evoItem);

  const weighted = [];
  for (const o of pool) {
    if (o.k === "evo") continue;
    for (let i = 0; i < o.weight; i++) weighted.push(o);
  }
  let guard = 0;
  while (picked.length < 3 && guard++ < 400) {
    const o = weighted[Math.floor(Math.random() * weighted.length)];
    if (!o) break;
    if (picked.some(q => q.k === o.k && (q.w === o.w && q.s === o.s))) continue;
    picked.push(o);
  }
  while (picked.length < 3) picked.push({ k: "attr", s: 0 });

  g.card = picked.slice(0, 3).map(o => {
    if (o.k === "new") return { code: CH_NEW(o.w), kind: "new", w: o.w };
    if (o.k === "up") return { code: CH_UP(o.w), kind: "up", w: o.w };
    if (o.k === "evo") return { code: CH_EVO(o.w), kind: "evo", w: o.w };
    return { code: CH_ATTR(o.s), kind: "attr", s: o.s };
  });
  g.choice = g.card.map(c => c.code);
  const evoIdx = g.card.findIndex(c => c.kind === "evo");
  if (evoIdx > 0) {
    const tmp = g.card[0]; g.card[0] = g.card[evoIdx]; g.card[evoIdx] = tmp;
    g.choice = g.card.map(c => c.code);
  }
  g.chs = 0;
}

function pickCard() {
  const c = g.card[g.chs];
  if (!c) { g.state = "play"; return; }
  if (c.kind === "new") {
    g.wown[c.w] = true; g.wlvl[c.w] = 1;
    g.tip = "得了 " + WNAME[c.w]; g.tipT = 2.4;
  } else if (c.kind === "up") {
    g.wlvl[c.w] = Math.min(5, g.wlvl[c.w] + 1);
    g.tip = WNAME[c.w] + " 到第 " + g.wlvl[c.w] + " 阶"; g.tipT = 2.4;
  } else if (c.kind === "evo") {
    g.wevo[c.w] = true;
    g.evoFlash = 1; g.flash = 0.5; g.shake = 0.3;
    addRing(P.x, P.y, 120, "#f0cf7a", 0.6);
    addParts(P.x, P.y, 26, "#f0cf7a", 180, 3);
    g.tip = "进化 · " + WEVONAME[c.w]; g.tipT = 3.2;
    sfx("evo");
  } else {
    if (c.s === 0) g.dmgMul += 0.2;
    if (c.s === 1) g.spdMul += 0.12;
    if (c.s === 2) { g.hp0 += 30; g.hp += 30; }
    if (c.s === 3) g.magnet += 40;
    if (c.s === 4) g.cdMul = Math.max(0.5, g.cdMul - 0.12);
    if (c.s === 5) g.xpMul += 0.15;
    g.tip = ATTRS[c.s].n + " · " + ATTRS[c.s].d; g.tipT = 2.4;
    sfx("ui");
  }
  g.xp = Math.max(0, g.xp);
  g.state = "play";
  checkLevel();
}

/* ---------- 特殊事件 ---------- */
const EVENTS = [
  { id: "blood", name: "血 月", desc: "精英怪围上来了，小心" },
  { id: "fog", name: "夜 雾", desc: "看不清了，它们却更快" },
  { id: "chest", name: "拾 遗", desc: "地上多了一只宝箱" },
  { id: "rain", name: "光 雨", desc: "天上的光点落下来了" },
];

function startEvent() {
  const ev = EVENTS[rndi(0, EVENTS.length - 1)];
  g.banner = ev.name; g.bannerT = 3.0;
  g.tip = ev.desc; g.tipT = 3.0;
  sfx("wave");
  if (ev.id === "blood") {
    for (let i = 0; i < 7; i++) {
      const t = [1, 5, 2, 3, 6][rndi(0, 4)];
      spawnAround(t);
    }
    for (const e of enemies) if (e.alive) e.frenzy = true;
    g.eventFrenzy = 24;
  } else if (ev.id === "fog") {
    g.fog = 22;
  } else if (ev.id === "chest") {
    for (let k = 0; k < 60; k++) {
      const a = rnd(0, TAU), dd = rnd(120, 260);
      const x = clamp(P.x + Math.cos(a) * dd, TS, WT * TS - TS);
      const y = clamp(P.y + Math.sin(a) * dd, TS, HT * TS - TS);
      if (!solidAt(x, y) && !solidAt(x + 10, y)) {
        pickups.push({ x, y, xp: 45, life: 26, kind: "chest" });
        break;
      }
    }
  } else {
    for (let i = 0; i < 26; i++) {
      const a = rnd(0, TAU), dd = rnd(40, 280);
      const x = clamp(P.x + Math.cos(a) * dd, TS, WT * TS - TS);
      const y = clamp(P.y + Math.sin(a) * dd, TS, HT * TS - TS);
      if (!solidAt(x, y)) pickups.push({ x, y, xp: 1 + rndi(0, 1), life: 20 });
    }
  }
}

/* ---------- 总更新 ---------- */
function update(dt) {
  g.anim += dt;
  if (g.tipT > 0) g.tipT -= dt;
  if (g.bannerT > 0) g.bannerT -= dt;
  if (g.shake > 0) g.shake = Math.max(0, g.shake - dt * 2);
  if (g.flash > 0) g.flash = Math.max(0, g.flash - dt * 2.4);
  if (g.iframe > 0) g.iframe = Math.max(0, g.iframe - dt);
  if (g.evoFlash > 0) g.evoFlash = Math.max(0, g.evoFlash - dt);
  if (g.fog > 0) g.fog = Math.max(0, g.fog - dt);
  if (g.eventFrenzy > 0) {
    g.eventFrenzy = Math.max(0, g.eventFrenzy - dt);
    if (g.eventFrenzy === 0) for (const e of enemies) e.frenzy = false;
  }

  if (g.state !== "play") { updateEffects(dt); return; }

  g.t += dt;
  g.flowT = (g.flowT || 0) + dt;
  if (g.flowT > 0.6) { g.flowT = 0; buildField(P.x, P.y); }
  g.eventT = (g.eventT || 0) + dt;
  if (g.eventT > 78 + rnd(0, 18)) { g.eventT = 0; startEvent(); }

  movePlayer(dt);
  spawnTick(dt);

  for (let w = 0; w < WP_COUNT; w++) {
    if (!g.wown[w]) continue;
    if (w === 2 || w === 15) continue;
    g.wcd[w] -= dt;
    if (g.wcd[w] <= 0) { fireWeapon(w); g.wcd[w] = cdOf(w); }
  }
  updateOrbit(dt);
  updateLamps(dt);
  updateGuard(dt);
  updateZones(dt);
  updateWaves(dt);
  updateBullets(dt);
  updateEnemies(dt);
  updatePickups(dt);
  updateEffects(dt);

  const tx = clamp(P.x - W / 2 + (P.dirX || 0) * 30, 0, WT * TS - W);
  const ty = clamp(P.y - H / 2 + (P.dirY || 0) * 24, 0, HT * TS - H);
  g.camx = lerp(g.camx, tx, Math.min(1, dt * 9));
  g.camy = lerp(g.camy, ty, Math.min(1, dt * 9));
  const s = g.shake * 6;
  g.shx = rnd(-s, s); g.shy = rnd(-s, s);
}

function updateEffects(dt) {
  for (let i = slashes.length - 1; i >= 0; i--) { slashes[i].life -= dt; if (slashes[i].life <= 0) slashes.splice(i, 1); }
  for (let i = pulses.length - 1; i >= 0; i--) { pulses[i].life -= dt; if (pulses[i].life <= 0) pulses.splice(i, 1); }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.94; p.vy *= 0.94;
    if (p.life <= 0) parts.splice(i, 1);
  }
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i];
    f.life -= dt; f.y -= dt * 26;
    if (f.life <= 0) floats.splice(i, 1);
  }
  for (let i = bullets.length - 1; i >= 0; i--) if (bullets[i].life <= 0) bullets.splice(i, 1);
}

/* PART4 */

/* ============================================================
   PART4 —— 渲染（exe 画风版）
   ------------------------------------------------------------
   一套和 Windows 版《夜行圆球》同源的美术：640×480 全分辨率直绘，
   不用像素放大；球体是「暗描边 + 亮高光 + 投影」，地面是石板，
   墙是砖块，画面收一圈暗角，主角脚下一盏灯。
   ============================================================ */

function makeCanvas(w, h) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  return c;
}

/* ---------- 素材烘焙 ---------- */
const floorTex = [], wallTex = [];
(function bake() {
  const BASES = ["#2b271e", "#292519", "#2d2920", "#28241a"];
  const P = 1;

  for (let v = 0; v < 4; v++) {
    const c = makeCanvas(TS, TS), x = c.getContext("2d");
    const base = BASES[v];
    x.fillStyle = base;
    x.fillRect(0, 0, TS, TS);

    // 石板缝：上、左各一道暗缝，右下压一点亮边
    x.fillStyle = "rgba(10,8,6,0.34)";
    x.fillRect(0, 0, TS, 2);
    x.fillRect(0, 0, 2, TS);
    x.fillStyle = "rgba(255,236,196,0.055)";
    x.fillRect(2, TS - 2, TS - 2, 1);
    x.fillRect(TS - 2, 2, 1, TS - 2);

    // 石面斑驳：几块大一点的浅 / 深色
    x.fillStyle = "rgba(255,240,205,0.032)";
    x.fillRect(3, 4, 12, 9);
    x.fillStyle = "rgba(0,0,0,0.06)";
    x.fillRect(17, 18, 11, 8);

    // 石粒：小点，位置随机但不成网格
    let sd = (v + 11) * 7919;
    const rr = () => { sd = (sd * 1103515245 + 12345) & 0x7fffffff; return sd / 0x7fffffff; };
    for (let i = 0; i < 26; i++) {
      const bx = 2 + Math.floor(rr() * (TS - 5));
      const by = 2 + Math.floor(rr() * (TS - 5));
      const r = rr();
      x.fillStyle = r < 0.55 ? "rgba(0,0,0,0.22)" : "rgba(255,235,195,0.07)";
      x.fillRect(bx, by, r < 0.2 ? 3 : 2, 2);
    }
    // 一道裂纹
    if (v === 2) {
      x.strokeStyle = "rgba(0,0,0,0.32)";
      x.lineWidth = 1;
      x.beginPath();
      x.moveTo(9, 27); x.lineTo(13, 22); x.lineTo(12, 17); x.lineTo(18, 12); x.lineTo(17, 6);
      x.stroke();
    }
    if (v === 3) {
      // 磨亮的石面
      x.fillStyle = "rgba(255,240,205,0.05)";
      x.fillRect(4, 5, 14, 9);
    }
    floorTex.push(c);
  }

  // 砖墙：横砖 16×8，错缝
  for (let v = 0; v < 3; v++) {
    const c = makeCanvas(TS, TS), x = c.getContext("2d");
    x.fillStyle = "#221c13";            // 灰浆底
    x.fillRect(0, 0, TS, TS);
    const bh = 8, bw = 16;
    for (let row = 0; row < 4; row++) {
      const off = row % 2 ? 8 : 0;
      for (let col = -1; col < 3; col++) {
        const bx = col * bw + off + 1, by = row * bh + 1;
        const shadeK = (row + col + v) % 3;
        x.fillStyle = shadeK === 0 ? "#463d2c" : shadeK === 1 ? "#403828" : "#4b4231";
        x.fillRect(bx, by, bw - 2, bh - 2);
        // 砖面上亮 / 下暗
        x.fillStyle = "rgba(255,238,198,0.10)";
        x.fillRect(bx, by, bw - 2, 1);
        x.fillStyle = "rgba(0,0,0,0.38)";
        x.fillRect(bx, by + bh - 3, bw - 2, 2);
        x.fillStyle = "rgba(0,0,0,0.20)";
        x.fillRect(bx + bw - 3, by, 2, bh - 2);
        // 偶尔一块裂了
        if (((row * 3 + col + v) % 7) === 0) {
          x.strokeStyle = "rgba(0,0,0,0.30)";
          x.lineWidth = 1;
          x.beginPath();
          x.moveTo(bx + 3, by + 5); x.lineTo(bx + 7, by + 3); x.lineTo(bx + 10, by + 5);
          x.stroke();
        }
      }
    }
    wallTex.push(c);
  }
})();

const vinTex = (function () {
  const c = makeCanvas(W, H), x = c.getContext("2d");
  const grd = x.createRadialGradient(W / 2, H / 2, H * 0.34, W / 2, H / 2, H * 0.95);
  grd.addColorStop(0, "rgba(0,0,0,0)");
  grd.addColorStop(0.62, "rgba(0,0,0,0.16)");
  grd.addColorStop(1, "rgba(0,0,0,0.55)");
  x.fillStyle = grd; x.fillRect(0, 0, W, H);
  return c;
})();

/* ---------- 圆球（暗描边 + 高光 + 投影） ---------- */
function ball(x, y, r, col, rim, highlight) {
  ctx.save();
  // 投影
  ctx.fillStyle = "rgba(0,0,0,0.38)";
  ctx.beginPath(); ctx.ellipse(x + 1.5, y + r * 0.86, r * 0.92, r * 0.36, 0, 0, TAU); ctx.fill();
  // 描边
  ctx.lineWidth = 2;
  ctx.strokeStyle = "rgba(9,8,6,0.95)";
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
  // 底
  ctx.fillStyle = rim;
  ctx.beginPath(); ctx.arc(x, y, r - 0.6, 0, TAU); ctx.fill();
  // 面
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(x, y - r * 0.07, Math.max(1, r - 1.6), 0, TAU); ctx.fill();
  // 高光
  if (highlight !== false) {
    ctx.fillStyle = "rgba(255,255,255,0.26)";
    ctx.beginPath(); ctx.ellipse(x - r * 0.34, y - r * 0.44, r * 0.30, r * 0.20, -0.55, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function eyes(x, y, r, followX, followY, dark) {
  const ex = r * 0.34, ey = r * 0.08;
  const pdx = clamp(followX, -1, 1) * r * 0.12, pdy = clamp(followY, -1, 1) * r * 0.12;
  for (let i = 0; i < 2; i++) {
    const cx = x + (i ? ex : -ex);
    ctx.fillStyle = dark ? "#2b2620" : "#f4ead3";
    ctx.beginPath(); ctx.ellipse(cx, y - ey, Math.max(1.2, r * 0.21), Math.max(1.4, r * 0.24), 0, 0, TAU); ctx.fill();
    ctx.fillStyle = dark ? "#f4ead3" : "#1f1b14";
    ctx.beginPath(); ctx.arc(cx + pdx, y - ey + pdy, Math.max(0.9, r * 0.105), 0, TAU); ctx.fill();
  }
}

/* ---------- 主绘制 ---------- */
function draw() {
  const camx = g.camx + g.shx;
  const camy = g.camy + g.shy;

  if (g.state === "title") {
    ctx.fillStyle = "#0a0906";
    ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 26; i++) {
      const sd = h2(i, 7, 91);
      const x = (sd % 600) + 20;
      const y = ((sd >> 9) % 480 + g.anim * (6 + (sd >> 3) % 10)) % 480;
      const a = 0.10 + ((sd >> 17) % 10) / 60;
      ctx.globalAlpha = a;
      ctx.fillStyle = "#e4d08a";
      ctx.beginPath(); ctx.arc(x, y, 1.4, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.drawImage(vinTex, 0, 0);
    drawOverlay();
    return;
  }

  /* 底：夜色 */
  ctx.fillStyle = "#0a0906";
  ctx.fillRect(0, 0, W, H);

  /* ---------- 地图 ---------- */
  const tx0 = Math.max(0, Math.floor(camx / TS) - 1), ty0 = Math.max(0, Math.floor(camy / TS) - 1);
  const tx1 = Math.min(WT, Math.ceil((camx + W) / TS) + 1), ty1 = Math.min(HT, Math.ceil((camy + H) / TS) + 1);
  for (let ty = ty0; ty < ty1; ty++) {
    for (let tx = tx0; tx < tx1; tx++) {
      const sx = Math.round(tx * TS - camx), sy = Math.round(ty * TS - camy);
      const isWall = tileAt(tx, ty) !== 0;
      const deepWall = isWall && tileAt(tx - 1, ty) !== 0 && tileAt(tx + 1, ty) !== 0 &&
                       tileAt(tx, ty - 1) !== 0 && tileAt(tx, ty + 1) !== 0;
      if (deepWall) {
        ctx.fillStyle = "#0b0906";
        ctx.fillRect(sx, sy, TS, TS);
        const spot = h2(tx, ty, 13);
        if ((spot & 0xff) < 30) {
          ctx.fillStyle = "rgba(150,130,96,0.10)";
          ctx.fillRect(sx + ((spot >> 8) % 24), sy + ((spot >> 15) % 22), 3, 2);
        }
        continue;
      }
      if (isWall) {
        ctx.drawImage(wallTex[h2(tx, ty, 41) % 3], sx, sy);
        // 整块砖墙的明暗起伏
        const tone = h2(tx, ty, 77) % 5;
        if (tone === 0) { ctx.fillStyle = "rgba(0,0,0,0.14)"; ctx.fillRect(sx, sy, TS, TS); }
        else if (tone === 1) { ctx.fillStyle = "rgba(255,236,196,0.055)"; ctx.fillRect(sx, sy, TS, TS); }
        // 顶部受光的亮边（上面是空地时）
        if (ty > 0 && !tileAt(tx, ty - 1)) {
          ctx.fillStyle = "rgba(240,220,176,0.16)";
          ctx.fillRect(sx, sy, TS, 3);
          ctx.fillStyle = "rgba(240,220,176,0.06)";
          ctx.fillRect(sx, sy + 3, TS, 2);
        }
        // 砖墙外侧的暗边
        ctx.fillStyle = "rgba(0,0,0,0.30)";
        ctx.fillRect(sx, sy + TS - 2, TS, 2);
        if (ty + 1 < HT && !tileAt(tx, ty + 1)) {
          ctx.fillStyle = "rgba(0,0,0,0.34)";
          ctx.fillRect(sx, sy + TS, TS, 4);
          ctx.fillStyle = "rgba(0,0,0,0.18)";
          ctx.fillRect(sx, sy + TS + 4, TS, 4);
        }
      } else {
        ctx.drawImage(floorTex[h2(tx, ty, 5) % 4], sx, sy);
        // 每块石板的明暗略有差别（exe 的地面就是一格一格深浅不一）
        const ftone = h2(tx, ty, 29) % 7;
        if (ftone === 0) { ctx.fillStyle = "rgba(0,0,0,0.13)"; ctx.fillRect(sx, sy, TS, TS); }
        else if (ftone === 1) { ctx.fillStyle = "rgba(255,240,205,0.035)"; ctx.fillRect(sx, sy, TS, TS); }
        // 零散物件：碎砖 / 骨头 / 铜钱
        const hv2 = h2(tx, ty, 61);
        if ((hv2 & 0xff) < 30) {
          const dx = sx + 5 + ((hv2 >> 8) % 22), dy = sy + 6 + ((hv2 >> 14) % 20);
          ctx.fillStyle = "rgba(0,0,0,0.4)";
          ctx.beginPath(); ctx.ellipse(dx + 2, dy + 3, 4, 1.6, 0, 0, TAU); ctx.fill();
          ctx.fillStyle = "rgba(180,168,138,0.40)";
          ctx.fillRect(dx, dy, 3, 2);
        }
        // 墙脚暗影
        if (tx > 0 && tileAt(tx - 1, ty)) {
          const gg = ctx.createLinearGradient(sx, 0, sx + 10, 0);
          gg.addColorStop(0, "rgba(0,0,0,0.30)"); gg.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = gg; ctx.fillRect(sx, sy, 10, TS);
        }
        if (ty > 0 && tileAt(tx, ty - 1)) {
          const gg = ctx.createLinearGradient(0, sy, 0, sy + TS);
          gg.addColorStop(0, "rgba(0,0,0,0.26)"); gg.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = gg; ctx.fillRect(sx, sy, TS, TS);
        }
      }
    }
  }

  /* ---------- 地图的色调 ---------- */
  if (g.map === 1) {            // 地宫：冷青
    ctx.fillStyle = "rgba(86,112,140,0.10)";
    ctx.fillRect(0, 0, W, H);
  } else if (g.map === 2) {     // 庭院：苔绿
    ctx.fillStyle = "rgba(96,120,80,0.09)";
    ctx.fillRect(0, 0, W, H);
  }

  /* ---------- 壁上的火把 ---------- */
  for (const tch of torches) {
    const sx = tch.x - camx, sy = tch.y - camy;
    if (sx < -60 || sy < -60 || sx > W + 60 || sy > H + 60) continue;
    const fl = 0.5 + 0.5 * Math.sin(g.anim * 7 + tch.x * 0.3);
    const gl = ctx.createRadialGradient(sx, sy + 4, 2, sx, sy + 4, 46);
    gl.addColorStop(0, "rgba(255,182,102," + (0.26 + 0.12 * fl) + ")");
    gl.addColorStop(0.45, "rgba(224,124,58," + (0.10 + 0.05 * fl) + ")");
    gl.addColorStop(1, "rgba(180,80,40,0)");
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(sx, sy + 4, 46, 0, TAU); ctx.fill();
    // 铁架
    ctx.fillStyle = "#3b2a12";
    ctx.fillRect(sx - 2.5, sy - 1, 5, 10);
    ctx.fillStyle = "#6b5126";
    ctx.fillRect(sx - 3.5, sy + 7, 7, 2);
    // 火苗
    ctx.fillStyle = "rgba(255,196,112," + (0.80 + 0.18 * fl) + ")";
    ctx.beginPath(); ctx.moveTo(sx, sy - 13 - fl * 3);
    ctx.quadraticCurveTo(sx + 5.5, sy - 2, sx, sy + 2);
    ctx.quadraticCurveTo(sx - 5.5, sy - 2, sx, sy - 13 - fl * 3);
    ctx.fill();
    ctx.fillStyle = "rgba(255,246,214,0.95)";
    ctx.beginPath(); ctx.moveTo(sx, sy - 7 - fl);
    ctx.quadraticCurveTo(sx + 2.4, sy - 1, sx, sy + 1);
    ctx.quadraticCurveTo(sx - 2.4, sy - 1, sx, sy - 7 - fl);
    ctx.fill();
  }

  /* ---------- 主角脚下那盏灯 ---------- */
  {
    const lx = P.x - camx, ly = P.y - camy;
    const gl = ctx.createRadialGradient(lx, ly, 6, lx, ly, 132);
    gl.addColorStop(0, "rgba(126,214,224,0.16)");
    gl.addColorStop(0.45, "rgba(74,169,182,0.07)");
    gl.addColorStop(1, "rgba(74,169,182,0)");
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(lx, ly, 132, 0, TAU); ctx.fill();
  }

  /* ---------- 池子（火 / 墨） ---------- */
  for (const z of zones) {
    const sx = z.x - camx, sy = z.y - camy;
    if (sx < -z.r - 20 || sy < -z.r - 20 || sx > W + z.r + 20 || sy > H + z.r + 20) continue;
    const a = Math.min(1, z.life / 0.6);
    ctx.save();
    if (z.kind === "fire") {
      const gl = ctx.createRadialGradient(sx, sy, 2, sx, sy, z.r);
      gl.addColorStop(0, "rgba(255,168,70," + 0.42 * a + ")");
      gl.addColorStop(0.6, "rgba(216,96,32," + 0.26 * a + ")");
      gl.addColorStop(1, "rgba(120,40,10,0)");
      ctx.fillStyle = gl;
      ctx.beginPath(); ctx.arc(sx, sy, z.r, 0, TAU); ctx.fill();
      for (let i = 0; i < 5; i++) {
        const aa = g.anim * 2 + i * 1.26, rr2 = z.r * 0.55;
        const fx = sx + Math.cos(aa) * rr2, fy = sy + Math.sin(aa) * rr2 * 0.6;
        ctx.fillStyle = "rgba(255,190,110," + (0.35 + 0.25 * Math.sin(g.anim * 8 + i)) * a + ")";
        ctx.beginPath(); ctx.arc(fx, fy, 3.5, 0, TAU); ctx.fill();
      }
    } else {
      const gl = ctx.createRadialGradient(sx, sy, 2, sx, sy, z.r);
      gl.addColorStop(0, "rgba(44,52,68," + 0.40 * a + ")");
      gl.addColorStop(0.7, "rgba(34,40,54," + 0.26 * a + ")");
      gl.addColorStop(1, "rgba(20,24,34,0)");
      ctx.fillStyle = gl;
      ctx.beginPath(); ctx.arc(sx, sy, z.r, 0, TAU); ctx.fill();
      ctx.strokeStyle = "rgba(140,160,190,0.20)";
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(sx, sy, z.r * 0.85, 0, TAU); ctx.stroke();
    }
    ctx.restore();
  }

  /* ---------- 声波 ---------- */
  for (const wv of waves) {
    const sx = wv.x - camx, sy = wv.y - camy;
    const a = Math.max(0, wv.life / wv.maxLife);
    ctx.save();
    ctx.globalAlpha = a * 0.38;
    ctx.strokeStyle = wv.evo ? "#f0cf7a" : "#e6d3a2";
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(sx, sy, wv.r, 0, TAU); ctx.stroke();
    ctx.globalAlpha = a * 0.7;
    ctx.lineWidth = 1.4;
    ctx.strokeStyle = "rgba(255,248,226,0.9)";
    ctx.beginPath(); ctx.arc(sx, sy, wv.r, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  /* ---------- 光点 ---------- */
  for (const p of pickups) {
    const sx = p.x - camx, sy = p.y - camy;
    if (sx < -26 || sy < -26 || sx > W + 26 || sy > H + 26) continue;
    if (p.kind === "chest") {
      // 宝箱
      ctx.fillStyle = "rgba(0,0,0,0.34)";
      ctx.beginPath(); ctx.ellipse(sx + 1, sy + 9, 12, 4, 0, 0, TAU); ctx.fill();
      const gl = ctx.createRadialGradient(sx, sy, 3, sx, sy, 26);
      gl.addColorStop(0, "rgba(240,207,122,0.35)"); gl.addColorStop(1, "rgba(240,207,122,0)");
      ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(sx, sy, 26, 0, TAU); ctx.fill();
      ctx.fillStyle = "#6b4a24";
      ctx.fillRect(sx - 9, sy - 2, 18, 11);
      ctx.fillStyle = "#8a6330";
      ctx.fillRect(sx - 9, sy - 7, 18, 6);
      ctx.strokeStyle = "#2a1c0c"; ctx.lineWidth = 1.5;
      ctx.strokeRect(sx - 9, sy - 7, 18, 16);
      ctx.fillStyle = "#f0cf7a";
      ctx.fillRect(sx - 1.5, sy - 4, 3, 7);
      continue;
    }
    const blink = ((p.life * 6) | 0) % 5 === 0;
    if (blink) continue;
    const gl = ctx.createRadialGradient(sx, sy, 2, sx, sy, 13);
    gl.addColorStop(0, "rgba(120,220,236,0.35)");
    gl.addColorStop(1, "rgba(111,191,207,0)");
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(sx, sy, 13, 0, TAU); ctx.fill();
    ctx.strokeStyle = "rgba(111,191,207,0.55)";
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(sx, sy, 6.5, 0, TAU); ctx.stroke();
    ctx.fillStyle = "#63c6d8";
    ctx.beginPath(); ctx.arc(sx, sy, 3.4, 0, TAU); ctx.fill();
    ctx.fillStyle = "#e6fbff";
    ctx.beginPath(); ctx.arc(sx - 1, sy - 1.2, 1.3, 0, TAU); ctx.fill();
  }

  /* ---------- 子弹 ---------- */
  for (const b of bullets) {
    const sx = b.x - camx, sy = b.y - camy;
    if (sx < -24 || sy < -24 || sx > W + 24 || sy > H + 24) continue;
    if (b.kind === 0) {
      const gl = ctx.createRadialGradient(sx, sy, 1, sx, sy, 12);
      gl.addColorStop(0, "rgba(240,207,122,0.28)");
      gl.addColorStop(1, "rgba(240,207,122,0)");
      ctx.fillStyle = gl;
      ctx.beginPath(); ctx.arc(sx, sy, 12, 0, TAU); ctx.fill();
      ball(sx, sy, 5, b.evo ? "#f0cf7a" : "#e2b862", b.evo ? "#8a6a24" : "#785820", false);
      ctx.fillStyle = "rgba(20,16,8,0.7)";
      ctx.fillRect(sx - 1.4, sy - 1.4, 2.8, 2.8);
    } else if (b.kind === 2) {
      ctx.save();
      ctx.translate(sx, sy); ctx.rotate(Math.atan2(b.vy, b.vx));
      ctx.fillStyle = b.evo ? "#f0cf7a" : "#f2e8d2";
      ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(-5, -6); ctx.lineTo(-2, 0); ctx.lineTo(-5, 6); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(-1, -1.6); ctx.lineTo(-1, 1.6); ctx.closePath(); ctx.fill();
      ctx.restore();
    } else if (b.kind === 5) {
      // 火团
      const gl = ctx.createRadialGradient(sx, sy, 1, sx, sy, 15);
      gl.addColorStop(0, "rgba(255,200,120,0.55)");
      gl.addColorStop(1, "rgba(232,112,58,0)");
      ctx.fillStyle = gl;
      ctx.beginPath(); ctx.arc(sx, sy, 15, 0, TAU); ctx.fill();
      ball(sx, sy, 6, "#e8703a", "#8c3a14", false);
      ctx.fillStyle = "rgba(255,226,150,0.9)";
      ctx.beginPath(); ctx.arc(sx - 1.5, sy - 2, 2.4, 0, TAU); ctx.fill();
    } else if (b.kind === 7) {
      // 铁砂
      ctx.save();
      ctx.translate(sx, sy); ctx.rotate(Math.atan2(b.vy, b.vx));
      ctx.globalAlpha = 0.8;
      ctx.fillStyle = b.evo ? "#ffd27a" : "#c8a37a";
      ctx.fillRect(-6, -1.2, 9, 2.4);
      ctx.globalAlpha = 0.35;
      ctx.fillRect(-12, -0.8, 6, 1.6);
      ctx.restore();
    } else if (b.kind === 6) {
      // 针
      ctx.strokeStyle = "rgba(220,232,245,0.9)";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(sx, sy - 12); ctx.lineTo(sx, sy + 6); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,0.85)";
      ctx.beginPath(); ctx.arc(sx, sy + 7, 1.8, 0, TAU); ctx.fill();
    } else {
      const gl = ctx.createRadialGradient(sx, sy, 1, sx, sy, 12);
      gl.addColorStop(0, "rgba(90,120,160,0.30)");
      gl.addColorStop(1, "rgba(70,95,130,0)");
      ctx.fillStyle = gl;
      ctx.beginPath(); ctx.arc(sx, sy, 12, 0, TAU); ctx.fill();
      ball(sx, sy, 5, "#2b3a4c", "#16202a", false);
      ctx.fillStyle = "rgba(160,190,220,0.7)";
      ctx.beginPath(); ctx.arc(sx - 1.6, sy - 2, 1.4, 0, TAU); ctx.fill();
    }
  }

  /* ---------- 敌人 ---------- */
  for (const e of enemies) {
    const sx = e.x - camx, sy = e.y - camy;
    if (sx < -40 || sy < -40 || sx > W + 40 || sy > H + 40) continue;
    const bob = Math.sin(e.wob) * 1.6;
    ctx.save();
    if (e.type === 9) {                             // 幽灵：半透 + 冷光
      ctx.globalAlpha = 0.58 + 0.18 * Math.sin(g.anim * 5 + e.wob);
      ctx.strokeStyle = "rgba(150,190,220,0.35)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sx, sy + bob, e.r + 4, 0, TAU); ctx.stroke();
    }
    if (e.type === 6) {                             // 自爆：红芯
      const pul = 0.5 + 0.5 * Math.sin(g.anim * 8);
      ctx.fillStyle = "rgba(232,112,58," + (0.20 + 0.18 * pul) + ")";
      ctx.beginPath(); ctx.arc(sx, sy + bob, e.r + 5 + pul * 2, 0, TAU); ctx.fill();
    }
    if (e.slow > 0) {
      ctx.strokeStyle = "rgba(198,210,222,0.55)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sx, sy + bob, e.r + 4, 0, TAU); ctx.stroke();
    }
    paperEnemy(e, sx, sy, g.anim);
    if (e.type === 4) {
      const gl = ctx.createRadialGradient(sx, sy, e.r * 0.5, sx, sy, e.r * 2.2);
      gl.addColorStop(0, "rgba(160,90,208,0.32)"); gl.addColorStop(1, "rgba(160,90,208,0)");
      ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(sx, sy, e.r * 2.2, 0, TAU); ctx.fill();
      const w = 60;
      ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(sx - w / 2, sy - e.r - 13, w, 4);
      ctx.fillStyle = "#a05ad0"; ctx.fillRect(sx - w / 2, sy - e.r - 13, w * Math.max(0, e.hp / e.hp0), 4);
    }
    ctx.restore();
  }

  /* ---------- 术士暗器 ---------- */
  for (const b of ebullets) {
    const sx = b.x - camx, sy = b.y - camy;
    if (sx < -20 || sy < -20 || sx > W + 20 || sy > H + 20) continue;
    const gl = ctx.createRadialGradient(sx, sy, 1, sx, sy, 11);
    gl.addColorStop(0, "rgba(160,90,208,0.30)");
    gl.addColorStop(1, "rgba(120,60,170,0)");
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(sx, sy, 11, 0, TAU); ctx.fill();
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(Math.atan2(b.vy, b.vx));
    ctx.fillStyle = "#e8dcc0";
    ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(-4, -3.5); ctx.lineTo(-4, 3.5); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  /* ---------- 符纸环绕 ---------- */
  if (g.wown[2]) {
    const l = g.wlvl[2], evo = g.wevo[2];
    const count = 2 + l + (evo ? 3 : 0), rad = 44 + l * 2;
    for (let i = 0; i < count; i++) {
      const a = g.orb + i * TAU / count;
      const sx = P.x + Math.cos(a) * rad - camx, sy = P.y + Math.sin(a) * rad - camy;
      ctx.save(); ctx.translate(sx, sy); ctx.rotate(a * 2);
      const gl = ctx.createRadialGradient(0, 0, 1, 0, 0, 11);
      gl.addColorStop(0, "rgba(190,160,255,0.40)"); gl.addColorStop(1, "rgba(190,160,255,0)");
      ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(0, 0, 11, 0, TAU); ctx.fill();
      ctx.fillStyle = evo ? "#f0cf7a" : "#e8d58a";
      ctx.fillRect(-3.5, -6, 7, 12);
      ctx.strokeStyle = "rgba(120,90,60,0.75)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-2.4, -3.6); ctx.lineTo(2.4, -3.6); ctx.stroke();
      ctx.restore();
    }
  }

  /* ---------- 刀光 ---------- */
  for (const s of slashes) {
    const p = 1 - s.life / s.max;
    const a = 1 - p;
    const sx = s.x - camx, sy = s.y - camy;
    if (s.type) {
      // 斩击：一条扫过去的薄月牙刃带
      const blood = s.type === "blood";
      const sweep = s.cone * (0.42 + 0.58 * p);
      const a0 = s.ang - sweep, a1 = s.ang + sweep;
      const N = 30;
      ctx.save();
      ctx.translate(sx, sy);
      if (blood) {
        ctx.globalAlpha = 0.16 * a;
        ctx.fillStyle = "#ff3050";
        ctx.beginPath(); ctx.arc(0, 0, s.reach * 0.55, 0, TAU); ctx.fill();
      }
      ctx.globalAlpha = 0.95 * a;
      ctx.beginPath();
      for (let i = 0; i <= N; i++) {
        const k = i / N, a2 = a0 + (a1 - a0) * k;
        const r1 = s.reach * (1.0 - 0.02 * k);
        const x = Math.cos(a2) * r1, y = Math.sin(a2) * r1;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      for (let i = N; i >= 0; i--) {
        const k = i / N, a2 = a0 + (a1 - a0) * k;
        const r0 = s.reach * (0.86 - 0.26 * k);
        ctx.lineTo(Math.cos(a2) * r0, Math.sin(a2) * r0);
      }
      ctx.closePath();
      ctx.fillStyle = blood ? "rgba(220,42,58,0.88)" : "rgba(140,196,230,0.78)";
      ctx.fill();
      ctx.globalAlpha = 1 * a;
      ctx.strokeStyle = blood ? "#ffe0e6" : "#ffffff";
      ctx.lineWidth = 2.6;
      ctx.beginPath();
      for (let i = 0; i <= N; i++) {
        const k = i / N, a2 = a0 + (a1 - a0) * k;
        const r1 = s.reach * (1.01 - 0.02 * k);
        const x = Math.cos(a2) * r1, y = Math.sin(a2) * r1;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.restore();
      continue;
    }
    ctx.save();
    ctx.translate(sx, sy);
    const r0 = s.reach * (0.45 + p * 0.55);
    const lw = s.full ? 4 : (s.evo ? 6 : 4.5);
    ctx.globalAlpha = (s.full ? 0.30 : 0.35) * a;
    ctx.strokeStyle = s.evo ? "#f0cf7a" : "#f4ead3";
    ctx.lineWidth = lw + 4;
    ctx.beginPath(); ctx.arc(0, 0, r0, s.ang - s.cone, s.ang + s.cone); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = s.evo ? `rgba(240,207,122,${0.9 * a})` : `rgba(238,228,200,${0.85 * a})`;
    ctx.lineWidth = lw;
    ctx.beginPath(); ctx.arc(0, 0, r0, s.ang - s.cone, s.ang + s.cone); ctx.stroke();
    ctx.restore();
  }

  /* ---------- 脉冲 ---------- */
  for (const p of pulses) {
    const k = 1 - p.life / p.max;
    const sx = p.x - camx, sy = p.y - camy;
    if (p.kind === "fill") {
      ctx.save();
      ctx.globalAlpha = 0.20 * (1 - k);
      ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(sx, sy, p.r * (0.5 + k * 0.6), 0, TAU); ctx.fill();
      ctx.restore();
    } else {
      ctx.save();
      const rr2 = p.r * (0.35 + k * 0.75);
      ctx.globalAlpha = 0.30 * (1 - k);
      ctx.strokeStyle = p.col; ctx.lineWidth = 8;
      ctx.beginPath(); ctx.arc(sx, sy, rr2, 0, TAU); ctx.stroke();
      ctx.globalAlpha = 0.75 * (1 - k);
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sx, sy, rr2, 0, TAU); ctx.stroke();
      ctx.restore();
    }
  }

  /* ---------- 主角 ---------- */
  {
    const sx = P.x - camx, sy = P.y - camy;
    if (Math.hypot(P.dirX, P.dirY) > 0.01) {
      ctx.save();
      for (let i = 3; i >= 1; i--) {
        ctx.globalAlpha = 0.10 + i * 0.03;
        ctx.fillStyle = "#4aa9b6";
        ctx.beginPath(); ctx.arc(sx - P.dirX * i * 5, sy - P.dirY * i * 5, Math.max(2, P.r - i * 1.4), 0, TAU); ctx.fill();
      }
      ctx.restore();
    }
    if (g.iframe > 0) {
      const gl = ctx.createRadialGradient(sx, sy, P.r, sx, sy, P.r + 14);
      gl.addColorStop(0, "rgba(255,240,200,0.65)"); gl.addColorStop(1, "rgba(255,240,200,0)");
      ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(sx, sy, P.r + 14, 0, TAU); ctx.fill();
      ctx.globalAlpha = (Math.floor(g.anim * 20) % 2) ? 0.55 : 1;
    }
    if (g.wown[15]) {
      const n = g.shield;
      const col = n > 0 ? "rgba(127,214,192," : "rgba(70,90,90,";
      for (let k = 0; k < Math.max(1, n); k++) {
        ctx.strokeStyle = col + (n > 0 ? 0.42 : 0.22) + ")";
        ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.arc(sx, sy, 15 + k * 4.2, 0, TAU); ctx.stroke();
      }
    }
    if (g.wown[8]) {
      const R = umbR();
      ctx.save();
      ctx.globalAlpha = 0.07;
      ctx.fillStyle = "#e6d3b0";
      ctx.beginPath(); ctx.arc(sx, sy, R, 0, TAU); ctx.fill();
      ctx.globalAlpha = 0.42;
      ctx.strokeStyle = "#cfa89a"; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(sx, sy, R, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
      ctx.globalAlpha = 0.9;
      ctx.strokeStyle = g.wevo[8] ? "#f0cf7a" : "#e6d3b0";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sx, sy - P.r - 12, 26, Math.PI, TAU); ctx.stroke();
      for (let i = 0; i < 5; i++) {
        const a2 = Math.PI + i * Math.PI / 4;
        ctx.beginPath();
        ctx.moveTo(sx, sy - P.r - 12);
        ctx.lineTo(sx + Math.cos(a2) * 19, sy - P.r - 12 + Math.sin(a2) * 19);
        ctx.stroke();
      }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    daoist(sx, sy + 3, g.anim, P.dirX < -0.15 ? -1 : 1, 1.28);
  }

  /* ---------- 插地灯 ----
     （灯桩在地，光晕按燃烧半径铺开，进化灯更亮） */
  for (const m of lamps) {
    const sx = m.x - camx, sy = m.y - camy;
    const fade = Math.min(1, m.life / 0.4);
    ctx.globalAlpha = 0.07 * fade;
    ctx.fillStyle = "#f2a761";
    ctx.beginPath(); ctx.arc(sx, sy, m.r, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.22 * fade;
    const gl = ctx.createRadialGradient(sx, sy, 2, sx, sy, 26);
    gl.addColorStop(0, "rgba(255,205,120,0.55)");
    gl.addColorStop(1, "rgba(240,170,80,0)");
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(sx, sy, 26, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = "rgba(0,0,0,0.32)";
    ctx.beginPath(); ctx.ellipse(sx + 1, sy + 9, 7, 2.6, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = "#4a3520"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(sx, sy + 8); ctx.lineTo(sx, sy + 15); ctx.stroke();
    ctx.fillStyle = m.evo ? "#ffd27a" : "#e8b25a";
    ctx.beginPath(); ctx.ellipse(sx, sy, 6.5, 8, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = "#3a2a12"; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.ellipse(sx, sy, 6.5, 8, 0, 0, TAU); ctx.stroke();
    ctx.fillStyle = "#fff2c8";
    ctx.beginPath(); ctx.ellipse(sx - 1.8, sy - 2, 2.2, 3, 0, 0, TAU); ctx.fill();
  }

  /* ---------- 粒子 ---------- */
  for (const p of parts) {
    const a = p.life / p.max;
    ctx.globalAlpha = Math.max(0, a);
    ctx.fillStyle = p.col;
    ctx.beginPath();
    ctx.arc(p.x - camx, p.y - camy, Math.max(0.8, p.size / 2), 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  /* ---------- 伤害数字 ---------- */
  for (const f of floats) {
    const a = Math.min(1, f.life / 0.35);
    ctx.globalAlpha = a * 0.95;
    ctx.font = (f.big ? "bold 17px" : "bold 14px") + ' "Microsoft YaHei", sans-serif';
    ctx.textAlign = "center";
    ctx.lineWidth = 3;
    ctx.strokeStyle = "rgba(8,7,5,0.85)";
    ctx.strokeText(f.txt, f.x - camx, f.y - camy);
    ctx.fillStyle = f.col;
    ctx.fillText(f.txt, f.x - camx, f.y - camy);
  }
  ctx.globalAlpha = 1;

  /* ---------- 暗角 / 夜雾 / 闪白 ---------- */
  ctx.drawImage(vinTex, 0, 0);
  if (g.fog > 0) {
    const a = Math.min(1, g.fog / 3) * 0.55;
    const gl = ctx.createRadialGradient(W / 2, H / 2, 40, W / 2, H / 2, 240);
    gl.addColorStop(0, "rgba(30,34,44,0)");
    gl.addColorStop(0.55, "rgba(36,42,54," + a * 0.55 + ")");
    gl.addColorStop(1, "rgba(20,24,32," + a + ")");
    ctx.fillStyle = gl;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "rgba(120,132,150," + (0.05 * Math.sin(g.anim * 0.6) + 0.06) + ")";
    ctx.fillRect(0, 0, W, H);
  }
  if (g.flash > 0) {
    ctx.fillStyle = "rgba(244,234,211," + Math.min(0.30, g.flash * 0.4) + ")";
    ctx.fillRect(0, 0, W, H);
  }

  /* ---------- 虚拟摇杆 ---------- */
  if (g.state === "play") {
    const al = stick.active ? 0.92 : 0.42;
    const bx = stick.active ? stick.bx : stick.hx;
    const by = stick.active ? stick.by : stick.hy;
    ctx.save();
    ctx.globalAlpha = al;
    ctx.fillStyle = "rgba(10,9,6,0.55)";
    ctx.beginPath(); ctx.arc(bx, by, stick.R, 0, TAU); ctx.fill();
    ctx.strokeStyle = "rgba(240,207,122,0.50)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(bx, by, stick.R, 0, TAU); ctx.stroke();
    ctx.strokeStyle = "rgba(244,234,211,0.20)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(bx, by, stick.R - 8, 0, TAU); ctx.stroke();
    ctx.strokeStyle = "rgba(244,234,211,0.26)";
    for (let i = 0; i < 4; i++) {
      const aa = i * Math.PI / 2;
      ctx.beginPath();
      ctx.moveTo(bx + Math.cos(aa) * (stick.R - 4), by + Math.sin(aa) * (stick.R - 4));
      ctx.lineTo(bx + Math.cos(aa) * (stick.R + 6), by + Math.sin(aa) * (stick.R + 6));
      ctx.stroke();
    }
    const kx = stick.active ? stick.kx : stick.hx;
    const ky = stick.active ? stick.ky : stick.hy;
    const gl = ctx.createRadialGradient(kx, ky, 2, kx, ky, stick.KR + 8);
    gl.addColorStop(0, "rgba(126,214,224,0.50)");
    gl.addColorStop(1, "rgba(74,169,182,0)");
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(kx, ky, stick.KR + 8, 0, TAU); ctx.fill();
    ctx.fillStyle = "#4aa9b6";
    ctx.beginPath(); ctx.arc(kx, ky, stick.KR, 0, TAU); ctx.fill();
    ctx.strokeStyle = "#17474f"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(kx, ky, stick.KR, 0, TAU); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.72)";
    ctx.beginPath(); ctx.arc(kx - 5, ky - 6, 3.2, 0, TAU); ctx.fill();
    ctx.restore();
  }

  drawHUD();
  drawOverlay();
}

function shade(hex, k) {
  let r = parseInt(hex.slice(1, 3), 16), gg = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  const f = (v) => clamp(Math.round(v * (1 + k)), 0, 255);
  r = f(r); gg = f(gg); b = f(b);
  return "rgb(" + r + "," + gg + "," + b + ")";
}

/* ============================================================
   PART5 —— HUD / 各屏 / 主循环
   ============================================================ */

function txt(s, x, y, size, col, align, bold) {
  ctx.font = (bold ? "bold " : "") + size + 'px "Microsoft YaHei", "PingFang SC", sans-serif';
  ctx.textAlign = align || "center";
  ctx.textBaseline = "alphabetic";
  ctx.lineWidth = Math.max(1, size / 9);
  ctx.strokeStyle = "rgba(6,5,4,0.8)";
  ctx.strokeText(s, x, y);
  ctx.fillStyle = col;
  ctx.fillText(s, x, y);
}

function drawWeaponIcon(cx, cy, r, w, evo) {
  const col = evo ? "#f0cf7a" : WCOLS[w];
  ctx.save();
  ctx.translate(cx, cy);
  if (w === 0) {
    ctx.save();
    ctx.rotate(-0.55);
    ctx.strokeStyle = col; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-r * 0.55, r * 0.9); ctx.lineTo(r * 0.55, -r * 0.9); ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,0.55)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-r * 0.75, r * 0.75); ctx.lineTo(-r * 0.15, r * 0.15); ctx.stroke();
    ctx.restore();
  } else if (w === 1) {
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
    ctx.fillStyle = "#1a1710"; ctx.fillRect(-2, -2, 4, 4);
  } else if (w === 2) {
    ctx.fillStyle = col; ctx.fillRect(-3, -r, 6, r * 2);
  } else if (w === 3) {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(r * 0.7, r * 0.5); ctx.lineTo(-r * 0.7, r * 0.5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#fff2c8"; ctx.beginPath(); ctx.arc(0, 0, r * 0.35, 0, TAU); ctx.fill();
  } else if (w === 4) {
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(0, 1, r * 0.8, 0.2, Math.PI - 0.2); ctx.fill();
    ctx.fillRect(-1.5, -r, 3, r);
  } else if (w === 5) {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(r, 0); ctx.lineTo(-r * 0.6, -r * 0.7); ctx.lineTo(-r * 0.1, 0); ctx.lineTo(-r * 0.6, r * 0.7); ctx.closePath(); ctx.fill();
  } else if (w === 6) {
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(0, 1, r * 0.75, 0, TAU); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.arc(-r * 0.3, -r * 0.2, r * 0.25, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  } else if (w === 7) {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(0, -r);
    ctx.quadraticCurveTo(r * 0.8, -r * 0.1, 0, r);
    ctx.quadraticCurveTo(-r * 0.8, -r * 0.1, 0, -r);
    ctx.fill();
    ctx.fillStyle = "#ffe6a8";
    ctx.beginPath(); ctx.moveTo(0, -r * 0.3);
    ctx.quadraticCurveTo(r * 0.35, 0, 0, r * 0.7);
    ctx.quadraticCurveTo(-r * 0.35, 0, 0, -r * 0.3);
    ctx.fill();
  } else if (w === 8) {
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, r, Math.PI, TAU); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(0, r); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-r * 0.6, -r * 0.7); ctx.lineTo(0, 0); ctx.lineTo(r * 0.6, -r * 0.7); ctx.stroke();
  } else if (w === 9) {
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
    ctx.fillStyle = col; ctx.globalAlpha = 0.55;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.5, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  } else if (w === 10) {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.ellipse(0, r * 0.2, r, r * 0.6, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.35)";
    ctx.beginPath(); ctx.ellipse(-r * 0.3, -r * 0.1, r * 0.25, r * 0.12, 0, 0, TAU); ctx.fill();
  } else if (w === 11) {
    ctx.fillStyle = col; ctx.fillRect(-1.5, -r, 3, r * 1.8);
    ctx.fillStyle = "rgba(255,255,255,0.6)"; ctx.fillRect(-0.5, -r, 1, r);
  } else if (w === 13) {
    ctx.strokeStyle = col; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-r * 0.9, r * 0.55); ctx.lineTo(r * 0.75, -r * 0.8); ctx.stroke();
    ctx.strokeStyle = "rgba(255,120,120,0.8)"; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(-r * 0.5, r * 0.2); ctx.lineTo(r * 0.55, -r * 0.6); ctx.stroke();
  } else if (w === 14) {
    ctx.fillStyle = col;
    ctx.fillRect(-r * 0.9, -r * 0.28, r * 1.5, r * 0.56);
    ctx.fillStyle = "#5a4a34";
    ctx.fillRect(r * 0.6, -r * 0.34, r * 0.3, r * 0.68);
    ctx.fillStyle = "#fff0c8";
    ctx.beginPath(); ctx.arc(r * 0.15, -r * 0.62, r * 0.18, 0, TAU); ctx.fill();
  } else if (w === 15) {
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, 0, r, r * 0.78, 0, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 0.5; ctx.fillStyle = col;
    ctx.beginPath(); ctx.ellipse(0, 0, r * 0.62, r * 0.46, 0, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  } else {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.ellipse(0, 0, r * 0.7, r * 0.85, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = "#7a5a20"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, r * 0.85); ctx.lineTo(0, r * 1.15); ctx.stroke();
    ctx.fillStyle = "#fff0c0"; ctx.globalAlpha = 0.7;
    ctx.beginPath(); ctx.ellipse(-r * 0.2, -r * 0.2, r * 0.25, r * 0.3, 0, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  if (evo) {
    ctx.fillStyle = "#f0cf7a";
    ctx.beginPath();
    const sx = cx + r + 1, sy = cy - r - 1;
    ctx.moveTo(sx, sy - 3); ctx.lineTo(sx + 3, sy); ctx.lineTo(sx, sy + 3); ctx.lineTo(sx - 3, sy);
    ctx.closePath(); ctx.fill();
  }
}

const SLOT_W = 20, SLOT_N = 16;

function drawHUD() {
  if (g.state === "title") return;
  ctx.fillStyle = "rgba(10,9,6,0.82)"; ctx.fillRect(8, 8, 194, 16);
  ctx.strokeStyle = "#4a4335"; ctx.lineWidth = 1; ctx.strokeRect(8.5, 8.5, 193, 15);
  const blink = g.iframe > 0 && (Math.floor(g.anim * 18) % 2);
  const hpr = clamp(g.hp / (g.hp0 || 1), 0, 1);
  const hpw = Math.round(190 * hpr);
  ctx.fillStyle = blink ? "#f4ead3" : (g.hp < g.hp0 / 3 ? "#d8483a" : "#74c25f");
  ctx.fillRect(10, 10, hpw, 12);
  ctx.fillStyle = "rgba(255,255,255,0.35)"; ctx.fillRect(10, 10, hpw, 4);
  ctx.fillStyle = "rgba(0,0,0,0.28)"; ctx.fillRect(10, 18, hpw, 4);
  ctx.fillStyle = "#0a0906";
  for (let k = 1; k * 20 < g.hp0; k++) {
    const x = 10 + Math.round(190 * (k * 20) / g.hp0);
    ctx.fillRect(x, 10, 1, 12);
  }
  txt(g.hp + "/" + g.hp0, 208, 22, 14, "#f4ead3", "left");

  const sec = Math.floor(g.t);
  const ts = Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
  txt(ts, W / 2, 26, 24, "#f4ead3", "center", true);
  const modeTxt = g.mode === "endless" ? "无尽 · 第 " + g.wave + " 波"
    : (g.diff === 2 ? "上路 · 噩梦" : g.diff === 1 ? "上路 · 困难" : "上路 · 普通");
  txt(modeTxt, W / 2, 42, 12, g.mode === "endless" ? "#d8b0f0" : "#9d9276");
  if (g.mode === "endless") {
    const left = Math.max(0, Math.ceil(g.nextBoss - g.bossT));
    txt("下一波 " + Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0"), W / 2, 57, 11, "#7f7458");
  }

  txt("级 " + g.level, W - 96, 22, 16, "#f0cf7a", "left", true);
  txt("杀 " + g.kills, W - 96, 40, 14, "#9d9276", "left");
  txt(g.mapName, W - 96, 54, 12, "#6d6552", "left");
  {
    const enh = Math.min(16, 1 + g.t / 140);
    txt("怪强化 ×" + enh.toFixed(1), W - 96, 70, 10, enh > 2.5 ? "#d8483a" : "#7f7458", "left");
  }

  {
    let x = 8;
    for (let w = 0; w < SLOT_N; w++) {
      const bx = x, by = H - 34;
      if (!g.wown[w]) {
        ctx.fillStyle = "rgba(10,9,6,0.5)"; ctx.fillRect(bx, by, SLOT_W - 2, 24);
        ctx.strokeStyle = "#2f2a22"; ctx.strokeRect(bx + 0.5, by + 0.5, SLOT_W - 3, 23);
      } else {
        const evo = g.wevo[w];
        ctx.fillStyle = "rgba(10,9,6,0.8)"; ctx.fillRect(bx, by, SLOT_W - 2, 24);
        ctx.strokeStyle = evo ? "#f0cf7a" : WCOLS[w]; ctx.strokeRect(bx + 0.5, by + 0.5, SLOT_W - 3, 23);
        drawWeaponIcon(bx + (SLOT_W - 2) / 2, by + 10, 6, w, evo);
        for (let k = 0; k < Math.min(5, g.wlvl[w]); k++) {
          ctx.fillStyle = evo ? "#f0cf7a" : "#f4ead3";
          ctx.fillRect(bx + 3 + k * 4, by + 20, 3, 2);
        }
      }
      x += SLOT_W;
    }
  }

  ctx.fillStyle = "rgba(10,9,6,0.86)"; ctx.fillRect(0, H - 4, W, 4);
  const xr = clamp(g.xp / (g.xpneed || 1), 0, 1);
  ctx.fillStyle = "#6fbfcf"; ctx.fillRect(0, H - 4, Math.round(W * xr), 3);
  ctx.fillStyle = "#d0f4ff"; ctx.fillRect(0, H - 4, Math.round(W * xr), 1);

  for (const e of enemies) {
    if (!e.alive || e.type !== 4) continue;
    const w = 320, x = (W - w) / 2, y = H - 58;
    ctx.fillStyle = "rgba(10,9,6,0.82)"; ctx.fillRect(x - 2, y - 2, w + 4, 12);
    ctx.strokeStyle = "#6a4a80"; ctx.strokeRect(x - 2.5, y - 2.5, w + 4, 12);
    ctx.fillStyle = "#a05ad0"; ctx.fillRect(x, y, Math.round(w * clamp(e.hp / e.hp0, 0, 1)), 8);
    txt("棺 主", W / 2, y - 8, 13, "#d8b0f0");
  }

  if (g.bannerT > 0) {
    ctx.globalAlpha = Math.min(1, g.bannerT / 0.6);
    txt(g.banner, W / 2, 150, 30, "#f0cf7a", "center", true);
    ctx.globalAlpha = 1;
  }

  if (g.tipT > 0) {
    ctx.globalAlpha = Math.min(1, g.tipT / 0.5);
    txt(g.tip, W / 2, H - 58, 14, "#f0cf7a");
    ctx.globalAlpha = 1;
  }
}

function dim(a) { ctx.fillStyle = "rgba(10,9,6," + a + ")"; ctx.fillRect(0, 0, W, H); }

function pixelBall(cx, cy, r, col, rim, withEyes) {
  const gl = ctx.createRadialGradient(cx, cy, r, cx, cy, r * 5);
  gl.addColorStop(0, "rgba(126,214,224,0.20)");
  gl.addColorStop(0.5, "rgba(74,169,182,0.07)");
  gl.addColorStop(1, "rgba(74,169,182,0)");
  ctx.fillStyle = gl;
  ctx.beginPath(); ctx.arc(cx, cy, r * 5, 0, TAU); ctx.fill();
  ball(cx, cy, r, col, rim, true);
  if (withEyes) eyes(cx, cy, r, 0, 0, false);
}

/* ---------- 二次元立绘：小道士 ---------- */
function daoist(sx, sy, t, face, sc) {
  ctx.save();
  ctx.translate(sx, sy);
  ctx.scale(face * sc, sc);
  const bob = Math.sin(t * 9) * 0.6;
  // 影子
  ctx.fillStyle = "rgba(0,0,0,0.34)";
  ctx.beginPath(); ctx.ellipse(0, 16, 10, 3, 0, 0, TAU); ctx.fill();
  // 腿靴
  ctx.fillStyle = "#20303a";
  ctx.fillRect(-5, 10 + bob, 4, 6); ctx.fillRect(1, 10 + bob, 4, 6);
  ctx.fillStyle = "#101a20";
  ctx.fillRect(-5.5, 15 + bob, 5, 2); ctx.fillRect(0.5, 15 + bob, 5, 2);
  // 道袍
  const rg = ctx.createLinearGradient(0, -4, 0, 12);
  rg.addColorStop(0, "#3f97a2"); rg.addColorStop(0.55, "#2c7a86"); rg.addColorStop(1, "#1a4d57");
  ctx.fillStyle = rg;
  ctx.beginPath();
  ctx.moveTo(-7, -2 + bob); ctx.lineTo(-10, 10 + bob);
  ctx.lineTo(-6, 12 + bob); ctx.lineTo(7, 12 + bob); ctx.lineTo(10, 10 + bob);
  ctx.lineTo(7, -2 + bob); ctx.closePath(); ctx.fill();
  // 袍边金线 + 下摆云纹
  ctx.strokeStyle = "#d9b96a"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-9.6, 9.5 + bob); ctx.lineTo(-6, 11.5 + bob); ctx.lineTo(7, 11.5 + bob); ctx.lineTo(9.6, 9.5 + bob); ctx.stroke();
  ctx.fillStyle = "rgba(217,185,106,0.85)";
  ctx.fillRect(-5, 7 + bob, 2, 1); ctx.fillRect(1, 7 + bob, 2, 1);
  // 腰带
  ctx.fillStyle = "#b8443a"; ctx.fillRect(-7.5, 1 + bob, 15, 2.6);
  ctx.fillStyle = "#e8c473"; ctx.fillRect(-1.2, 0.6 + bob, 2.4, 3.4);
  // 袖子
  ctx.fillStyle = "#317f8b";
  ctx.beginPath(); ctx.ellipse(-8.5, 2.5 + bob, 3.6, 5.6, 0.25, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(8.5, 2.5 + bob, 3.6, 5.6, -0.25, 0, TAU); ctx.fill();
  ctx.fillStyle = "#f0d2ac";
  ctx.beginPath(); ctx.arc(-8.8, 7 + bob, 1.8, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(8.8, 7 + bob, 1.8, 0, TAU); ctx.fill();
  // 拂尘（右手）
  ctx.save(); ctx.translate(8.8, 6 + bob); ctx.rotate(-0.45);
  ctx.strokeStyle = "#7b5a30"; ctx.lineWidth = 1.2;

  ctx.beginPath(); ctx.ellipse(3.1, -6.2 + bob, 1.75, 2.25, 0, 0, TAU); ctx.fill();

  // 胸前黄符

}

  // 长发

  ctx.beginPath(); ctx.moveTo(-14, -12); ctx.quadraticCurveTo(-22, 16, -16, 34);

    ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(i * 2.4, -34 - Math.abs(i) * 1.5); ctx.stroke();
  }

  ctx.fillStyle = "rgba(255,255,255,0.95)";

  ctx.restore();
}

/* ---------- 纸人系怪物 ---------- */
function paperEnemy(e, sx, sy, t) {
  const r = e.r, ty = e.type, z = e.r / 12 * 1.12;
  const bob = Math.sin(e.wob) * 1.4;
  const paper = "#efe3c9", paper2 = "#cdbf9f", ink = "#2b241c";
  ctx.save();
  ctx.translate(sx, sy + bob);
  ctx.fillStyle = "rgba(0,0,0,0.30)";
  ctx.beginPath(); ctx.ellipse(0, r * 0.95, r * 0.85, r * 0.28, 0, 0, TAU); ctx.fill();
  ctx.scale(z, z);
  if (ty === 4) {
    /* 棺主：纸糊大棺 */
    ctx.fillStyle = "#2a1a1a"; ctx.fillRect(-18, -16, 36, 30);
    ctx.fillStyle = "#7d3a2e"; ctx.fillRect(-17, -15, 34, 28);
    ctx.fillStyle = "#b8443a"; ctx.fillRect(-17, -15, 34, 3);
    ctx.strokeStyle = "#e8cf8c"; ctx.lineWidth = 1;
    ctx.strokeRect(-15.5, -13.5, 31, 25);
    ctx.fillStyle = "#e8d28c";
    ctx.fillRect(-4, -12, 8, 20);
    ctx.fillStyle = "#b8443a";
    ctx.fillRect(-2.5, -9, 5, 1.8); ctx.fillRect(-2.5, -4, 5, 1.8); ctx.fillRect(-2.5, 1, 5, 1.8);
    ctx.fillStyle = "#efdfc0";
    ctx.beginPath(); ctx.arc(-11, -6, 3, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(11, -6, 3, 0, TAU); ctx.fill();
    ctx.fillStyle = ink;
    ctx.beginPath(); ctx.arc(-11.6, -6.4, 0.9, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(10.4, -6.4, 0.9, 0, TAU); ctx.fill();
  } else if (ty === 6) {
    /* 纸灯笼 · 爆 */
    const pul = 0.5 + 0.5 * Math.sin(t * 9 + e.wob);
    ctx.fillStyle = "rgba(255,150,80," + (0.25 + 0.25 * pul) + ")";
    ctx.beginPath(); ctx.arc(0, 0, 13 + pul * 3, 0, TAU); ctx.fill();
    ctx.fillStyle = "#d4553c";
    ctx.beginPath(); ctx.ellipse(0, 0, 9, 11, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = "#7c2c1c"; ctx.lineWidth = 1;
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath(); ctx.ellipse(0, 0, 9 - Math.abs(i) * 2.4, 11, 0, 0, TAU); ctx.stroke();
    }
    ctx.fillStyle = "#f0cf7a"; ctx.fillRect(-6, -12.5, 12, 2.4); ctx.fillRect(-6, 10, 12, 2.4);
    ctx.fillStyle = "#fff0c0"; ctx.beginPath(); ctx.arc(0, 0, 2.4, 0, TAU); ctx.fill();
  } else {
    /* 纸身：上圆下摆，纸边锯齿 */
    ctx.fillStyle = ty === 9 ? "rgba(232,226,208,0.62)" : paper;
    ctx.beginPath();
    ctx.moveTo(-r * 0.62, -r * 0.45);
    ctx.quadraticCurveTo(0, -r * 0.95, r * 0.62, -r * 0.45);
    ctx.lineTo(r * 0.78, r * 0.72);
    for (let i = 3; i >= 1; i--) {
      ctx.lineTo(r * 0.78 - i * r * 0.39, r * 0.72);
      ctx.lineTo(r * 0.78 - i * r * 0.39 + r * 0.195, r * 0.98);
      ctx.lineTo(r * 0.78 - i * r * 0.39 + r * 0.39, r * 0.72);
    }
    ctx.lineTo(-r * 0.78, r * 0.72);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(60,48,36,0.55)"; ctx.lineWidth = 0.9; ctx.stroke();
    // 纸纤维的淡淡阴影
    ctx.fillStyle = "rgba(140,120,90,0.16)";
    ctx.fillRect(-r * 0.62, -r * 0.1, r * 0.3, r * 0.5);
    // 纸头
    ctx.fillStyle = ty === 9 ? "rgba(232,226,208,0.62)" : "#f6ebd2";
    ctx.beginPath(); ctx.arc(0, -r * 0.62, r * 0.50, 0, TAU); ctx.fill();
    ctx.strokeStyle = "rgba(60,48,36,0.5)"; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.arc(0, -r * 0.62, r * 0.50, 0, TAU); ctx.stroke();
    // 墨眼 + 朱唇
    ctx.fillStyle = ty === 9 ? "rgba(30,40,55,0.6)" : ink;
    ctx.beginPath(); ctx.ellipse(-r * 0.20, -r * 0.66, r * 0.10, r * 0.14, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(r * 0.20, -r * 0.66, r * 0.10, r * 0.14, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "rgba(190,70,52,0.85)";
    ctx.fillRect(-r * 0.12, -r * 0.40, r * 0.24, r * 0.06);
    // 两颊纸符
    ctx.fillStyle = "rgba(200,90,70,0.35)";
    ctx.beginPath(); ctx.arc(-r * 0.32, -r * 0.48, r * 0.09, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(r * 0.32, -r * 0.48, r * 0.09, 0, TAU); ctx.fill();
    // 胸口朱印
    ctx.fillStyle = "#b8443a"; ctx.fillRect(-r * 0.13, r * 0.05, r * 0.26, r * 0.26);
    ctx.strokeStyle = "#f2e4c4"; ctx.lineWidth = 0.8;
    ctx.strokeRect(-r * 0.10, r * 0.08, r * 0.20, r * 0.20);
    // 竹骨手臂
    ctx.strokeStyle = "#8a6a3c"; ctx.lineWidth = 0.9;
    ctx.beginPath(); ctx.moveTo(-r * 0.55, -r * 0.2); ctx.lineTo(-r * 0.95, r * 0.15); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r * 0.55, -r * 0.2); ctx.lineTo(r * 0.95, r * 0.15); ctx.stroke();
    // 各类纸人的辨识特征
    if (ty === 0) {                 // 灰纸人：头顶一撮白纸条
      ctx.strokeStyle = "#efe3c9"; ctx.lineWidth = 1;
      for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(i * 2, -r * 1.05); ctx.lineTo(i * 3, -r * 1.35); ctx.stroke(); }
    } else if (ty === 1) {          // 青纸人：长腿小跑
      ctx.strokeStyle = "#7f9c4a"; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(-r * 0.25, r * 0.9); ctx.lineTo(-r * 0.3, r * 1.25); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(r * 0.25, r * 0.9); ctx.lineTo(r * 0.3, r * 1.25); ctx.stroke();
    } else if (ty === 2) {          // 红纸人：尖角
      ctx.fillStyle = "#a83c30";
      ctx.beginPath(); ctx.moveTo(-r * 0.35, -r * 1.0); ctx.lineTo(-r * 0.18, -r * 1.45); ctx.lineTo(-r * 0.02, -r * 1.0); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(r * 0.35, -r * 1.0); ctx.lineTo(r * 0.18, -r * 1.45); ctx.lineTo(r * 0.02, -r * 1.0); ctx.closePath(); ctx.fill();
    } else if (ty === 3) {          // 橙纸轿
      ctx.fillStyle = "#a8642f"; ctx.fillRect(-r * 0.85, r * 0.55, r * 1.7, r * 0.5);
      ctx.fillStyle = "#e0a55c"; ctx.fillRect(-r * 0.85, r * 0.55, r * 1.7, r * 0.12);
    } else if (ty === 5) {          // 铁甲纸将：三片甲
      ctx.fillStyle = "rgba(125,138,156,0.85)";
      ctx.fillRect(-r * 0.62, -r * 0.15, r * 1.24, r * 0.20);
      ctx.fillRect(-r * 0.55, r * 0.15, r * 1.10, r * 0.18);
      ctx.strokeStyle = "rgba(210,220,230,0.5)"; ctx.lineWidth = 0.8;
      ctx.strokeRect(-r * 0.62, -r * 0.15, r * 1.24, r * 0.20);
    } else if (ty === 7) {          // 术士纸人：黑兜帽
      ctx.fillStyle = "rgba(52,44,68,0.92)";
      ctx.beginPath(); ctx.arc(0, -r * 0.62, r * 0.62, Math.PI * 1.04, Math.PI * 1.96); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-r * 0.62, -r * 0.62); ctx.lineTo(-r * 0.72, -r * 0.05); ctx.lineTo(-r * 0.44, -r * 0.1); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "rgba(176,110,214,0.35)";
      ctx.beginPath(); ctx.arc(0, r * 0.25, r * 0.35, 0, TAU); ctx.fill();
    } else if (ty === 8) {          // 裂纸人：身上一道口子
      ctx.strokeStyle = "rgba(40,32,24,0.65)"; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(-r * 0.1, -r * 0.35); ctx.lineTo(r * 0.15, 0); ctx.lineTo(-r * 0.05, r * 0.35); ctx.lineTo(r * 0.2, r * 0.7); ctx.stroke();
    } else if (ty === 9) {          // 纸影：冷雾
      ctx.strokeStyle = "rgba(150,190,220,0.35)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, r * 1.05, 0, TAU); ctx.stroke();
    }
  }
  // 被冰/减速：霜边
  if (e.slow > 0) {
    ctx.strokeStyle = "rgba(205,222,236,0.7)"; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(0, 0, r * 1.02, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}
