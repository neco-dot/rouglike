<!DOCTYPE html>

  :root { --ink: #0a0906; --paper: #f4ead3; --gold: #f0cf7a; }

  html, body {

<script>
"use strict";
/* ============================================================
   夜行圆球 · 进化版 —— 单文件网页版（JS 主体）
   逻辑分辨率 640x480，全部 Canvas 手绘，零外部依赖
   ============================================================ */

const W = 640, H = 480, TS = 32, WT = 160, HT = 120;
const cv = document.getElementById("cv");
let ctx = cv.getContext("2d");

/* ---------- 小工具 ---------- */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const dist2 = (ax, ay, bx, by) => (ax - bx) * (ax - bx) + (ay - by) * (ay - by);
const TAU = Math.PI * 2;

function h2(x, y, s) {
  let h = (x * 73856093) ^ (y * 19349663) ^ (s * 83492791);
  h ^= h >>> 13; h = (h * 1540483477) | 0; h ^= h >>> 15;
  return Math.abs(h) >>> 0;
}

/* ---------- 音效（WebAudio 实时合成） ---------- */
let AC = null, master = null;
const lastPlay = Object.create(null);
function audioInit() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain();
    master.gain.value = 0.6;
    master.connect(AC.destination);
  } catch (e) { AC = null; }
}
function tone(freq, dur, type, gain, freq2, delay) {
  if (!AC) return;
  const t0 = AC.currentTime + (delay || 0);
  const o = AC.createOscillator();
  const g = AC.createGain();
  o.type = type || "sine";
  o.frequency.setValueAtTime(freq, t0);
  if (freq2) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq2), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(gain == null ? 0.2 : gain, t0 + Math.min(0.02, dur));
  g.gain.exponentialRampToValueAtTime(0.0006, t0 + dur);
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0 + dur + 0.03);
}
function noise(dur, gain, freq, delay) {
  if (!AC) return;
  const n = Math.floor(AC.sampleRate * dur);
  const buf = AC.createBuffer(1, n, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = AC.createBufferSource(); src.buffer = buf;
  const bp = AC.createBiquadFilter(); bp.type = "bandpass";
  bp.frequency.value = freq || 900; bp.Q.value = 0.8;
  const g = AC.createGain(); g.gain.value = gain == null ? 0.15 : gain;
  g.gain.exponentialRampToValueAtTime(0.0004, AC.currentTime + dur);
  src.connect(bp); bp.connect(g); g.connect(master);
  src.start(AC.currentTime + (delay || 0));
}
function sfx(name) {
  if (!AC) return;
  const now = performance.now() / 1000;
  const gap = name === "kill" ? 0.05 : name === "swing" ? 0.10 : 0.03;
  if (lastPlay[name] && now - lastPlay[name] < gap) return;
  lastPlay[name] = now;
  switch (name) {
    case "swing": noise(0.15, 0.12, 1500); break;
    case "coin": tone(880, 0.10, "triangle", 0.14, 1320); break;
    case "talisman": tone(520, 0.08, "sine", 0.09, 700); break;
    case "lamp": tone(320, 0.30, "sine", 0.12, 470); tone(660, 0.20, "triangle", 0.05, 780, 0.02); break;
    case "bell": tone(1180, 0.34, "sine", 0.13, 700); tone(1770, 0.26, "sine", 0.07, 1100, 0.01); break;
    case "crane": tone(1000, 0.12, "sine", 0.09, 1500); break;
    case "ink": noise(0.20, 0.13, 520); tone(220, 0.18, "sine", 0.09, 120); break;
    case "fire": noise(0.22, 0.13, 380); tone(180, 0.20, "sawtooth", 0.07, 90); break;
    case "gong": tone(180, 0.42, "sine", 0.15, 120); tone(360, 0.30, "triangle", 0.06, 210, 0.03); break;
    case "needle": tone(1500, 0.07, "square", 0.05, 2100); break;
    case "pool": tone(140, 0.28, "sine", 0.09, 70); noise(0.16, 0.07, 260); break;
    case "lantern": tone(700, 0.18, "triangle", 0.10, 950); break;
    case "kill": noise(0.08, 0.09, 2200); break;
    case "pick": tone(1320, 0.07, "sine", 0.08, 1700); break;
    case "hurt": tone(180, 0.22, "sawtooth", 0.15, 90); noise(0.12, 0.10, 600); break;
    case "level": tone(523, 0.16, "triangle", 0.15, 784); tone(784, 0.22, "triangle", 0.11, 1046, 0.10); break;
    case "ui": tone(720, 0.06, "square", 0.05, 900); break;
    case "evo": tone(392, 0.26, "triangle", 0.13, 784); tone(784, 0.34, "sine", 0.11, 1174, 0.10); break;
    case "boss": tone(110, 0.9, "sawtooth", 0.16, 55); tone(220, 0.7, "sine", 0.09, 110, 0.05); break;
    case "wave": tone(300, 0.5, "triangle", 0.13, 520); tone(520, 0.6, "sine", 0.09, 800, 0.12); break;
    case "die": tone(300, 0.5, "sawtooth", 0.15, 60); break;
    case "win": [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.3, "triangle", 0.12, f, i * 0.14)); break;
  }
}

/* ---------- 输入 ---------- */
const input = { ok: false, back: false, left: false, right: false, up: false, down: false, esc: false };
const keys = Object.create(null);
const touch = { active: false, x: 0, y: H / 2 };
/* 左下虚拟摇杆：按下时底座跟到指头，松开归位 */
const stick = {
  id: null, active: false, R: 50, KR: 19,
  hx: 78, hy: H - 102, bx: 78, by: H - 102, dx: 0, dy: 0, kx: 78, ky: H - 102,
};
function stickPress(p, id) {
  stick.active = true; stick.id = id == null ? -1 : id;
  stick.bx = clamp(p.x, stick.R + 6, W * 0.5);
  stick.by = clamp(p.y, stick.R + 6, H - stick.R - 40);
  stick.dx = 0; stick.dy = 0;
  stick.kx = stick.bx; stick.ky = stick.by;
}
function stickMove(p) {
  let ox = p.x - stick.bx, oy = p.y - stick.by;
  const d = Math.hypot(ox, oy), lim = stick.R - 6;
  if (d > lim) { ox = ox / d * lim; oy = oy / d * lim; }
  stick.kx = stick.bx + ox; stick.ky = stick.by + oy;
  const m = Math.min(1, d / lim), a = Math.atan2(oy, ox);
  stick.dx = Math.cos(a) * m; stick.dy = Math.sin(a) * m;
}
function stickRelease() {
  stick.active = false; stick.id = null; stick.dx = 0; stick.dy = 0;
  stick.bx = stick.hx; stick.by = stick.hy; stick.kx = stick.hx; stick.ky = stick.hy;
}

addEventListener("keydown", (e) => {
  const k = e.key;
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "Enter", "Backspace"].includes(k)) e.preventDefault();
  if (!keys[k]) {
    if (k === "Enter" || k === " " || k === "z" || k === "Z") input.ok = true;
    if (k === "ArrowLeft" || k === "a" || k === "A") input.left = true;
    if (k === "ArrowRight" || k === "d" || k === "D") input.right = true;
    if (k === "ArrowUp") input.up = true;
    if (k === "ArrowDown") input.down = true;
    if (k === "x" || k === "X" || k === "Backspace") input.back = true;
    if (k === "Escape") input.esc = true;
    audioInit();
    if (AC && AC.state === "suspended") AC.resume();
  }
  keys[k] = true;
}, { passive: false });
addEventListener("keyup", (e) => { keys[e.key] = false; });
addEventListener("blur", () => {
  for (const k in keys) keys[k] = false;
  touch.active = false;
  if (stick.id !== null) stickRelease();
});

function localPoint(e) {
  const r = cv.getBoundingClientRect();
  const cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
  const cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
  return { x: cx / r.width * W, y: cy / r.height * H };
}
function touchPoint(t) {
  const r = cv.getBoundingClientRect();
  return { x: (t.clientX - r.left) / r.width * W, y: (t.clientY - r.top) / r.height * H };
}
function localPoint(e) {
  const r = cv.getBoundingClientRect();
  if (e.touches && e.touches.length) {
    const t = e.touches[0];
    return { x: (t.clientX - r.left) / r.width * W, y: (t.clientY - r.top) / r.height * H };
  }
  const cx = e.clientX - r.left, cy = e.clientY - r.top;
  return { x: cx / r.width * W, y: cy / r.height * H };
}
function pressAt(p, id) {
  input.ok = true;
  if (g.state === "level") {
    for (let i = 0; i < 3; i++) {
      const bx = 30 + i * 194, by = 104, bw = 182, bh = 210;
      if (p.x >= bx && p.x <= bx + bw && p.y >= by && p.y <= by + bh) { g.chs = i; pickCard(); }
    }
  } else if (g.state === "title") {
    // 菜单：点哪一行就选哪一行（再按一次出发）
    for (let i = 0; i < MENU.length; i++) {
      const y = 246 + i * 34;
      if (p.x >= 130 && p.x <= 510 && p.y >= y - 22 && p.y <= y + 10) {
        if (g.menu === i) input.ok = true;
        else { g.menu = i; sfx("ui"); }
      }
    }
    if (p.x >= 186 && p.x <= 454 && p.y >= 380 && p.y <= 414) {
      g.mapSel = (g.mapSel + 1) % 4; sfx("ui");
    }
  } else if (g.state === "play") {
    if (p.x < W * 0.54 && p.y > H * 0.44) stickPress(p, id);   // 左下：摇杆
    else { touch.active = true; touch.x = p.x; touch.y = p.y; } // 其余：点哪走哪
  }
}
function onPress(e) {
  if (e.preventDefault) e.preventDefault();
  audioInit();
  if (AC && AC.state === "suspended") AC.resume();
  pressAt(localPoint(e), -1);
}
cv.addEventListener("mousedown", onPress);
cv.addEventListener("touchstart", (e) => {
  e.preventDefault();
  audioInit();
  if (AC && AC.state === "suspended") AC.resume();
  const t = e.changedTouches[0];
  if (t) pressAt(touchPoint(t), t.identifier);
}, { passive: false });
cv.addEventListener("mousemove", (e) => {
  const p = localPoint(e);
  if (stick.active && stick.id === -1) { stickMove(p); return; }
  if (!touch.active) return;
  touch.x = p.x; touch.y = p.y;
});
cv.addEventListener("mouseup", () => { touch.active = false; if (stick.id === -1) stickRelease(); });
cv.addEventListener("touchmove", (e) => {
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    const p = touchPoint(t);
    if (stick.active && t.identifier === stick.id) stickMove(p);
    else if (touch.active) { touch.x = p.x; touch.y = p.y; }
  }
}, { passive: false });
function touchEnd(e) {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (stick.active && t.identifier === stick.id) stickRelease();
  }
  touch.active = false;
}
cv.addEventListener("touchend", (e) => { e.preventDefault(); touchEnd(e); }, { passive: false });
cv.addEventListener("touchcancel", (e) => { touchEnd(e); }, { passive: false });
cv.addEventListener("mouseleave", () => { touch.active = false; if (stick.id === -1) stickRelease(); });
addEventListener("mouseup", () => { if (stick.id === -1) stickRelease(); });

function clearEdge() {
  input.ok = input.back = input.left = input.right = input.up = input.down = input.esc = false;
}

/* ---------- 全局状态 ---------- */
const g = {
  state: "title", t: 0, anim: 0, kills: 0, level: 1, xp: 0, xpneed: 4,
  hp: 130, hp0: 130,
  camx: 0, camy: 0, shx: 0, shy: 0, shake: 0, flash: 0, iframe: 0,
  chs: 0, choice: [0, 0, 0], card: [{ k: 0, i: 0 }, { k: 0, i: 0 }, { k: 0, i: 0 }],
  tip: "", tipT: 0, bossSpawned: false, evoFlash: 0, evoName: "",
  dmgMul: 1, spdMul: 1, magnet: 64, cdMul: 1, xpMul: 1, seed: Math.floor(Math.random() * 1e9),
  wown: new Array(16).fill(false), wlvl: new Array(16).fill(0), wevo: new Array(16).fill(false),
  wcd: new Array(16).fill(0), orb: 0, talTick: 0, shield: 0, shieldT: 0,
  padPrevA: false, padPrevB: false, padA: false, padB: false,
  padX: 0, padY: 0,
  // 模式
  mode: "road", diff: 0, mapSel: 0, wave: 1, waveMul: 1, menu: 0, nextBoss: 360, bossT: 0,
  banner: "", bannerT: 0, fog: 0, eventT: 0, eventFrenzy: 0, map: 0, mapName: "老宅",
};

const P = { x: 0, y: 0, r: 10, ang: 0, dirX: 0, dirY: 0 };

const VER = "0.9.1";
const NEWS = [
  "道士立绘，纸人当道",
  "隔墙不锁怪，隔墙不刷怪",
  "十六样，多了护心镜",
  "剑光吸血刀改斩击",
  "纸伞挡弹，墨池留潭",
  "铜钱镖撞墙反弹",
];

const WP_COUNT = 16;
const WNAME = ["剑光", "铜钱镖", "符纸环绕", "长明灯", "铜铃", "纸鹤", "墨滴",
               "火折子", "纸伞", "铜锣", "墨池", "针雨", "灯笼", "吸血刀", "火铳", "护心镜"];
const WEVONAME = ["月华斩", "万钱阵", "符阵流转", "灯王长明", "钟鸣不止", "群鹤归巢", "泼墨成山",
                  "燎原火", "风雨不透", "锣鼓喧天", "砚海无涯", "千针落", "双灯引路",
                  "血河斩", "铁砂崩", "明镜高悬"];
const WCOLS = ["#efe6cd", "#e8bd66", "#a483dc", "#f2a761", "#c6d2de", "#f2e8d2", "#8ba1c0",
               "#e8703a", "#cfa89a", "#d9b26a", "#6a7d94", "#b9c6d6", "#f2c46a",
               "#d0563a", "#c8a37a", "#7fd6c0"];
const ATTRS = [
  { n: "开刃", d: "伤害 +20%", c: "#d8b45a" },
  { n: "轻身", d: "移动 +12%", c: "#8fc46a" },
  { n: "厚皮", d: "血上限 +30", c: "#c0392b" },
  { n: "吸星", d: "拾取范围 +40", c: "#6fbfcf" },
  { n: "快手", d: "出手更快 12%", c: "#f2a761" },
  { n: "贪光", d: "经验 +15%", c: "#a483dc" },
];
/* 卡片编码：新武器 / 升级 / 进化 / 属性 */
const CH_NEW = (w) => w;
const CH_UP = (w) => WP_COUNT + w;
const CH_EVO = (w) => WP_COUNT * 2 + w;
const CH_ATTR = (s) => WP_COUNT * 3 + s;

/* 菜单：四档 */
const MENU = [
  { n: "上路 · 普通", d: "夜路如常，先练个手", mode: "road", diff: 0 },
  { n: "上路 · 困难", d: "怪更硬，也更疼", mode: "road", diff: 1 },
  { n: "上路 · 噩梦", d: "一步三怪，别贪手", mode: "road", diff: 2 },
  { n: "无尽 · 一波接一波", d: "棺主倒下，今夜还没完", mode: "endless", diff: 0 },
];

let world = new Uint8Array(WT * HT);
const enemies = [];
const bullets = [];
const pickups = [];
const slashes = [];
const pulses = [];
const parts = [];
const floats = [];
const orbs = [];
const zones = [];      // 灼烧 / 墨池
const waves = [];      // 铜锣声波
const minions = [];    // 灯笼
const lamps = [];      // 插地灯
const ebullets = [];   // 术士暗器
const torches = [];    // 地宫壁上的火把

/* PART2 */

/* ============================================================
   PART2 —— 世界生成 / 开局 / 基础更新
   ============================================================ */

const tileAt = (tx, ty) => {
  if (tx < 0 || ty < 0 || tx >= WT || ty >= HT) return 1;
  return world[ty * WT + tx];
};
const solidAt = (x, y) => tileAt(Math.floor(x / TS), Math.floor(y / TS)) !== 0;

/* ---------- 连通域 + 流场：只把怪放在能走到玩家的地上 ---------- */
const reach = new Uint8Array(WT * HT);
const flow = new Int16Array(WT * HT);
function buildField(sx, sy) {
  reach.fill(0);
  flow.fill(-1);
  const tx0 = clamp(Math.floor(sx / TS), 0, WT - 1);
  const ty0 = clamp(Math.floor(sy / TS), 0, HT - 1);
  const start = ty0 * WT + tx0;
  if (world[start] !== 0) return;
  const q = [start];
  flow[start] = 0; reach[start] = 1;
  let head = 0;
  while (head < q.length) {
    const cur = q[head++];
    const cx = cur % WT, cy = (cur - cx) / WT;
    const d = flow[cur];
    for (let k = 0; k < 4; k++) {
      const nx = cx + (k === 0 ? 1 : k === 1 ? -1 : 0);
      const ny = cy + (k === 2 ? 1 : k === 3 ? -1 : 0);
      if (nx < 0 || ny < 0 || nx >= WT || ny >= HT) continue;
      const ni = ny * WT + nx;
      if (world[ni] !== 0 || flow[ni] >= 0) continue;
      flow[ni] = d + 1; reach[ni] = 1; q.push(ni);
    }
  }
}
function flowDir(x, y) {
  const tx = Math.floor(x / TS), ty = Math.floor(y / TS);
  if (tx < 0 || ty < 0 || tx >= WT || ty >= HT) return null;
  const d0 = flow[ty * WT + tx];
  if (d0 < 0) return null;
  let bx = tx, by = ty, bd = d0;
  for (let oy = -1; oy <= 1; oy++) {
    for (let ox = -1; ox <= 1; ox++) {
      if (!ox && !oy) continue;
      const nx = tx + ox, ny = ty + oy;
      if (nx < 0 || ny < 0 || nx >= WT || ny >= HT) continue;
      if (solidAt(nx * TS + TS / 2, ny * TS + TS / 2)) continue;
      if (ox && oy && (solidAt((tx + ox) * TS + TS / 2, ty * TS + TS / 2) ||
                       solidAt(tx * TS + TS / 2, (ty + oy) * TS + TS / 2))) continue;
      const d2 = flow[ny * WT + nx];
      if (d2 < 0 || d2 >= bd) continue;
      bd = d2; bx = nx; by = ny;
    }
  }
  if (bx === tx && by === ty) return null;
  const cx = bx * TS + TS / 2, cy = by * TS + TS / 2;
  const dd = Math.hypot(cx - x, cy - y) || 1;
  return { x: (cx - x) / dd, y: (cy - y) / dd };
}

const MAPNAMES = ["老宅", "地宫", "庭院"];

function genWorld(map) {
  world.fill(1);
  torches.length = 0;
  const rooms = [];
  if (map === 1) {
    // 地宫：四×三 的厅堂网格，横竖走廊连成一张网，正中挖一间大殿
    torches.length = 0;
    const M = 10, COLS = 4, ROWS = 3;
    const CW = Math.floor((WT - M * 2) / COLS), CH = Math.floor((HT - M * 2) / ROWS);
    for (let ry = 0; ry < ROWS; ry++) {
      for (let rx = 0; rx < COLS; rx++) {
        const cx0 = M + rx * CW, cy0 = M + ry * CH;
        const w = rndi(Math.max(9, CW - 13), CW - 8);
        const h = rndi(Math.max(8, CH - 12), CH - 7);
        const x = cx0 + Math.floor((CW - w) / 2) + rndi(-2, 2);
        const y = cy0 + Math.floor((CH - h) / 2) + rndi(-2, 2);
        rooms.push({ x, y, w, h });
        for (let ty = y; ty < y + h; ty++)
          for (let tx = x; tx < x + w; tx++) world[ty * WT + tx] = 0;
      }
    }
    // 横向走廊
    for (let ry = 0; ry < ROWS; ry++) {
      for (let rx = 0; rx < COLS - 1; rx++) {
        const a = rooms[ry * COLS + rx], b = rooms[ry * COLS + rx + 1];
        const y0 = Math.floor(a.y + a.h / 2) - 1;
        const x0 = a.x + a.w - 2, x1 = b.x + 1;
        for (let ty = y0; ty < y0 + 2; ty++)
          for (let tx = x0; tx <= x1; tx++)
            if (tx > 1 && tx < WT - 1 && ty > 1 && ty < HT - 1) world[ty * WT + tx] = 0;
      }
    }
    // 纵向走廊
    for (let rx = 0; rx < COLS; rx++) {
      for (let ry = 0; ry < ROWS - 1; ry++) {
        const a = rooms[ry * COLS + rx], b = rooms[(ry + 1) * COLS + rx];
        const x0 = Math.floor(a.x + a.w / 2) - 1;
        const y0 = a.y + a.h - 2, y1 = b.y + 1;
        for (let tx = x0; tx < x0 + 2; tx++)
          for (let ty = y0; ty <= y1; ty++)
            if (tx > 1 && tx < WT - 1 && ty > 1 && ty < HT - 1) world[ty * WT + tx] = 0;
      }
    }
    // 正中的大殿（中列两格打通）
    const hall = { x: M + CW + 4, y: M + CH + 3, w: CW * 2 - 14, h: CH - 10 };
    rooms.push(hall);
    for (let ty = hall.y; ty < hall.y + hall.h; ty++)
      for (let tx = hall.x; tx < hall.x + hall.w; tx++) world[ty * WT + tx] = 0;
    // 柱网：每 6 格一根，靠边的两格留出来
    for (const r of rooms) {
      for (let py = r.y + 3; py < r.y + r.h - 3; py += 6) {
        for (let px = r.x + 3; px < r.x + r.w - 3; px += 6) {
          if (h2(px, py, 41) % 4 !== 0) continue;
          world[py * WT + px] = 1;
        }
      }
    }
    // 柱子：四角靠内各一根（厅够大才立）
    for (const r of rooms) {
      if (r.w < 12 || r.h < 9) continue;
      for (const px of [r.x + 2, r.x + r.w - 3])
        for (const py of [r.y + 2, r.y + r.h - 3])
          if (h2(px, py, 33) % 3 === 0) world[py * WT + px] = 1;
    }
    // 丘墟：零星塌下来的砖堆
    for (let i = 0; i < 26; i++) {
      const r = rooms[rndi(0, rooms.length - 1)];
      const tx = rndi(r.x + 1, r.x + r.w - 2), ty = rndi(r.y + 1, r.y + r.h - 2);
      if (h2(tx, ty, 51) % 4 === 0) world[ty * WT + tx] = 1;
    }
    // 壁上火把：靠墙的地面格
    for (let ty = 1; ty < HT - 1 && torches.length < 70; ty++) {
      for (let tx = 1; tx < WT - 1; tx++) {
        if (torches.length >= 70) break;
        if (world[ty * WT + tx] !== 0) continue;
        if (world[(ty - 1) * WT + tx] !== 1) continue;
        if (h2(tx, ty, 97) % 9 !== 0) continue;
        torches.push({ x: tx * TS + TS / 2, y: ty * TS + 3 });
      }
    }
  } else if (map === 2) {
    // 庭院：一块大空地 + 石柱
    const x = 14, y = 12, w = WT - 28, h = HT - 24;
    rooms.push({ x, y, w, h });
    for (let ty = y; ty < y + h; ty++)
      for (let tx = x; tx < x + w; tx++) world[ty * WT + tx] = 0;
    for (let i = 0; i < 28; i++) {
      const px = rndi(x + 4, x + w - 8), py = rndi(y + 4, y + h - 8);
      const s = rndi(1, 2);
      for (let a = 0; a < s; a++) for (let b = 0; b < s; b++) world[(py + b) * WT + px + a] = 1;
    }
    // 四角的小屋
    const corners = [[x + 2, y + 2], [x + w - 12, y + 2], [x + 2, y + h - 10], [x + w - 12, y + h - 10]];
    for (const c of corners) {
      for (let ty = c[1]; ty < c[1] + 6; ty++)
        for (let tx = c[0]; tx < c[0] + 8; tx++) world[ty * WT + tx] = 0;
      rooms.push({ x: c[0], y: c[1], w: 8, h: 6 });
    }
  } else {
    // 老宅：随机房间 + 连廊（原样）
    for (let i = 0; i < 40 && rooms.length < 13; i++) {
      const w = rndi(6, 13), h = rndi(5, 10);
      const x = rndi(6, WT - w - 6), y = rndi(6, HT - h - 6);
      let bad = false;
      for (const r of rooms) {
        if (x < r.x + r.w + 3 && x + w + 3 > r.x && y < r.y + r.h + 3 && y + h + 3 > r.y) { bad = true; break; }
      }
      if (bad) continue;
      rooms.push({ x, y, w, h });
    }
    if (!rooms.length) rooms.push({ x: 40, y: 30, w: 12, h: 9 });

    for (const r of rooms) {
      for (let ty = r.y; ty < r.y + r.h; ty++)
        for (let tx = r.x; tx < r.x + r.w; tx++)
          world[ty * WT + tx] = 0;
    }
    for (let i = 1; i < rooms.length; i++) {
      const a = rooms[i - 1], b = rooms[i];
      const ax = Math.floor(a.x + a.w / 2), ay = Math.floor(a.y + a.h / 2);
      const bx = Math.floor(b.x + b.w / 2), by = Math.floor(b.y + b.h / 2);
      const x0 = Math.min(ax, bx), x1 = Math.max(ax, bx);
      const y0 = Math.min(ay, by), y1 = Math.max(ay, by);
      for (let tx = x0; tx <= x1; tx++) {
        world[ay * WT + tx] = 0;
        if (ay - 1 > 0) world[(ay - 1) * WT + tx] = 0;
      }
      for (let ty = y0; ty <= y1; ty++) {
        world[ty * WT + bx] = 0;
        if (bx - 1 > 0) world[ty * WT + bx - 1] = 0;
      }
    }
    for (let k = 0; k < 20; k++) {
      const tx = rndi(10, WT - 11), ty = rndi(10, HT - 11);
      if (world[ty * WT + tx] === 0 && Math.random() < 0.14) {
        world[ty * WT + tx] = 1;
        if (Math.random() < 0.5 && ty + 1 < HT) world[(ty + 1) * WT + tx] = 1;
      }
    }
  }
  return rooms.length ? rooms : [{ x: 40, y: 30, w: 12, h: 9 }];
}

/* ---------- 伤害 / 粒子 ---------- */
function addFloat(x, y, txt, col, big) {
  if (floats.length > 90) floats.shift();
  floats.push({ x, y, txt, col: col || "#f4ead3", life: 0.8, max: 0.8, big: !!big });
}
function addParts(x, y, n, col, spd, size) {
  for (let i = 0; i < n; i++) {
    if (parts.length > 320) parts.shift();
    const a = rnd(0, TAU), v = rnd(spd * 0.35, spd);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rnd(0.22, 0.55), max: 0.55, col, size: size || 2 });
  }
}
function addRing(x, y, r, col, life) {
  if (pulses.length > 40) pulses.shift();
  pulses.push({ x, y, r, col, life: life || 0.34, max: life || 0.34 });
}

function damageEnemy(e, dmg) {
  if (!e.alive) return;
  const v = Math.max(1, Math.round(dmg * g.dmgMul));
  e.hp -= v;
  addFloat(e.x + rnd(-5, 5), e.y - e.r - 5, String(v), "#f4ead3", false);
  addParts(e.x, e.y, 3, "#d8c9a8", 80, 2);
  if (e.hp <= 0) {
    e.alive = false;
    g.kills++;
    sfx("kill");
    addParts(e.x, e.y, 10, e.type === 4 ? "#e8c8ff" : "#bfae8f", 140, 3);
    addRing(e.x, e.y, e.r + 6, "#fdf6e3", 0.22);
    if (e.type === 4) {
      for (let i = 0; i < 9; i++) pickups.push({ x: e.x + rnd(-20, 20), y: e.y + rnd(-20, 20), xp: 6, life: 9 });
      g.flash = 0.55;
      if (g.mode === "endless") {
        // 无尽：棺主倒下 → 下一波
        g.wave++;
        g.waveMul = 1 + 0.35 * (g.wave - 1);
        g.bossSpawned = false;
        g.nextBoss = 165;
        g.bossT = 0;
        g.banner = "第 " + g.wave + " 波"; g.bannerT = 3.2;
        g.shake = 0.5;
        sfx("wave");
        for (let i = 0; i < 5; i++) pickups.push({ x: e.x + rnd(-26, 26), y: e.y + rnd(-26, 26), xp: 10, life: 12 });
      } else {
        g.state = "win"; sfx("win");
      }
    } else {
      if (e.type === 8 && !e.splitDone) {           // 分裂：裂成两只小的
        e.splitDone = true;
        for (let k = 0; k < 2; k++) {
          const a = k ? 0.9 : -0.9;
          const nx = e.x + Math.cos(a) * 8, ny = e.y + Math.sin(a) * 8;
          if (solidAt(nx, ny)) continue;
          spawnEnemy(1, nx, ny);
          const kid = enemies[enemies.length - 1];
          if (kid) { kid.hp = Math.max(5, Math.round(e.hp0 * 0.22)); kid.hp0 = kid.hp; }
        }
        addParts(e.x, e.y, 8, "#cfc08c", 120, 3);
      }
      pickups.push({ x: e.x + rnd(-3, 3), y: e.y + rnd(-3, 3), xp: [1, 2, 4, 3, 30, 5, 2, 3, 3, 4][e.type] || 2, life: 22 });
    }
  }
}

/* ---------- 敌人 ---------- */
const ETYPE = [
  { hp: 9, spd: 44, r: 9, dmg: 4, col: "#a89b86" },
  { hp: 15, spd: 66, r: 9, dmg: 5, col: "#8fc46a" },
  { hp: 34, spd: 36, r: 14, dmg: 9, col: "#b4a68c" },
  { hp: 20, spd: 30, r: 10, dmg: 6, col: "#c0793b" },
  { hp: 950, spd: 42, r: 26, dmg: 16, col: "#a05ad0" },
  { hp: 62, spd: 24, r: 16, dmg: 12, col: "#7d8a9c" },
  { hp: 22, spd: 62, r: 9, dmg: 11, col: "#d0563a" },
  { hp: 30, spd: 34, r: 11, dmg: 5, col: "#6a5a86" },
  { hp: 28, spd: 40, r: 12, dmg: 7, col: "#9a8f6a" },
  { hp: 26, spd: 36, r: 10, dmg: 6, col: "#8ea8bd" },
];

function spawnEnemy(type, x, y) {
  const t = ETYPE[type];
  const df = DIFFF[g.diff];
  // 随时间变硬：血量每 70 秒翻一倍，伤害每 5 分钟翻一倍，速度缓慢爬
  const hpMul = 1 + g.t / 140;
  const dmgMul = 1 + g.t / 300;
  const spdMul = 1 + Math.min(0.5, g.t / 700);
  const hpScale = Math.min(16, hpMul * g.waveMul * df.hp);
  const hp = Math.round(t.hp * hpScale);
  enemies.push({
    x, y, type, r: t.r, col: t.col, hp, hp0: hp,
    spd: t.spd * spdMul * (g.mode === "endless" ? 1 + 0.02 * (g.wave - 1) : 1),
    dmg: Math.round(t.dmg * dmgMul * df.dmg), slow: 0, slowmul: 1, alive: true, wob: rnd(0, TAU),
  });
}

function spawnAround(type) {
  for (let i = 0; i < 30; i++) {
    const a = rnd(0, TAU), d = rnd(280, 380);
    const x = P.x + Math.cos(a) * d, y = P.y + Math.sin(a) * d;
    if (x < TS + 8 || y < TS + 8 || x > WT * TS - TS - 8 || y > HT * TS - TS - 8) continue;
    const rr = ETYPE[type].r + 4;
    if (solidAt(x, y) || solidAt(x + rr, y) || solidAt(x - rr, y)) continue;
    if (solidAt(x, y + rr) || solidAt(x, y - rr)) continue;
    if (!losLine(P.x, P.y, x, y)) continue;   // 不隔墙冒出来
    const ti = Math.floor(y / TS) * WT + Math.floor(x / TS);
    if (!reach[ti]) continue;
    spawnEnemy(type, x, y);
    return true;
  }
  return false;
}

function spawnTick(dt) {
  const df = DIFFF[g.diff];
  const rate = (0.55 + g.t * 0.012) * df.rate * (g.mode === "endless" ? 1 + 0.08 * (g.wave - 1) : 1);
  g.spawnAcc += dt * Math.min(4.5, rate);
  while (g.spawnAcc >= 1) {
    g.spawnAcc -= 1;
    if (enemies.length > 105) break;
    const p = Math.random();
    let type = 0;
    if (g.t > 45 && p < 0.30) type = 1;
    else if (g.t > 95 && p < 0.18) type = 2;
    else if (g.t > 150 && p < 0.13) type = 3;
    else if (g.t > 240 && p < 0.10) type = 5;
    else if (g.t > 200 && p > 0.88) type = 6;
    else if (g.t > 260 && p > 0.80 && p <= 0.88) type = 7;
    else if (g.t > 320 && p > 0.74 && p <= 0.80) type = 8;
    else if (g.t > 380 && p > 0.68 && p <= 0.74) type = 9;
    if (g.t < 25) type = 0;
    spawnAround(type);
  }
  // 棺主：上路 6 分钟；无尽每 210 / 165 秒一波
  if (g.mode === "endless") {
    g.bossT += dt;
    if (!g.bossSpawned && g.bossT >= g.nextBoss) {
      g.bossSpawned = true;
      g.bossT = 0;
      spawnAround(4) || bossFallback();
      sfx("boss");
      g.tip = "第 " + g.wave + " 波的棺主"; g.tipT = 3; g.shake = 0.4;
    }
  } else if (!g.bossSpawned && g.t >= 360) {
    g.bossSpawned = true;
    spawnAround(4) || bossFallback();
    sfx("boss");
    g.tip = "棺主出来了"; g.tipT = 3; g.shake = 0.4;
  }
}

function bossFallback() {
  for (let k = 0; k < 200; k++) {
    const a = rnd(0, TAU), dd = rnd(300, 460);
    const x = clamp(P.x + Math.cos(a) * dd, TS, WT * TS - TS);
    const y = clamp(P.y + Math.sin(a) * dd, TS, HT * TS - TS);
    const ti = Math.floor(y / TS) * WT + Math.floor(x / TS);
    if (!solidAt(x, y) && !solidAt(x + 20, y) && !solidAt(x - 20, y) && reach[ti]) { spawnEnemy(4, x, y); return true; }
  }
  return false;
}

/* ---------- 玩家移动 ---------- */
function blockedAt(x, y) {
  const r = P.r - 1;
  return solidAt(x - r, y - r) || solidAt(x + r, y - r) || solidAt(x - r, y + r) || solidAt(x + r, y + r);
}

function moveBy(dx, dy) {
  if (dx && !blockedAt(P.x + dx, P.y)) P.x += dx;
  if (dy && !blockedAt(P.x, P.y + dy)) P.y += dy;
  P.x = clamp(P.x, P.r + 2, WT * TS - P.r - 2);
  P.y = clamp(P.y, P.r + 2, HT * TS - P.r - 2);
}

function movePlayer(dt) {
  let dx = 0, dy = 0, mag = 1;
  if (keys["ArrowLeft"] || keys["a"] || keys["A"]) dx -= 1;
  if (keys["ArrowRight"] || keys["d"] || keys["D"]) dx += 1;
  if (keys["ArrowUp"] || keys["w"] || keys["W"]) dy -= 1;
  if (keys["ArrowDown"] || keys["s"] || keys["S"]) dy += 1;
  dx += g.padX; dy += g.padY;

  if (stick.active) {
    // 摇杆：推多远走多快
    dx = stick.dx; dy = stick.dy;
    mag = Math.min(1, Math.hypot(dx, dy));
    if (mag < 0.10) return;
  } else if (!dx && !dy && touch.active) {
    const wx = touch.x + g.camx, wy = touch.y + g.camy;
    const d = Math.hypot(wx - P.x, wy - P.y);
    if (d > 12) { dx = (wx - P.x) / d; dy = (wy - P.y) / d; }
  }
  const len = Math.hypot(dx, dy);
  if (len > 0.001) {
    dx /= len; dy /= len;
    P.ang = Math.atan2(dy, dx);
    const sp = 104 * g.spdMul * dt * mag;
    moveBy(dx * sp, dy * sp);
  }
}
