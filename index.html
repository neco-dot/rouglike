  }

  if (g.state === "level") {
    ctx.fillStyle = "#0a0906"; ctx.fillRect(0, 0, W, H);
    const gl = ctx.createRadialGradient(W / 2, 120, 20, W / 2, 120, 260);
    gl.addColorStop(0, "rgba(58,47,28,0.55)"); gl.addColorStop(1, "rgba(58,47,28,0)");
    ctx.fillStyle = gl; ctx.fillRect(0, 0, W, H);
    txt("升到 " + g.level + " 级，挑一样", W / 2, 52, 26, "#f0cf7a", "center", true);
    txt("← → 换一张，回车 定下（也可以直接点卡片）", W / 2, 78, 13, "#9d9276");

    for (let i = 0; i < 3; i++) {
      const c = g.card[i];
      const x = 30 + i * 194, y = 104, w = 182, h = 210;
      const sel = i === g.chs;
      ctx.fillStyle = sel ? "rgba(42,36,24,0.95)" : "rgba(23,20,15,0.92)";
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = sel ? "#f0cf7a" : "#3d372c";
      ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
      if (sel) { ctx.strokeStyle = "#8a7440"; ctx.strokeRect(x + 3.5, y + 3.5, w - 7, h - 7); }

      let title = "？", desc = "？", tag = "", iconW = -1, evo = false, iconCol = "#9fa898";
      if (c.kind === "new") { title = WNAME[c.w]; desc = "新家伙 · 自动出手"; iconW = c.w; iconCol = WCOLS[c.w]; }
      else if (c.kind === "up") { title = WNAME[c.w]; desc = "第 " + (g.wlvl[c.w] + 1) + " 阶加强"; iconW = c.w; iconCol = WCOLS[c.w]; }
      else if (c.kind === "evo") { title = WEVONAME[c.w]; desc = "进化 · 换一副打法"; tag = "五阶成形"; iconW = c.w; evo = true; iconCol = "#f0cf7a"; }
      else { title = ATTRS[c.s].n; desc = ATTRS[c.s].d; iconCol = ATTRS[c.s].c; }

      if (iconW >= 0) {
        drawWeaponIcon(x + w / 2, y + 56, 18, iconW, evo);
      } else {
        ctx.strokeStyle = iconCol; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(x + w / 2, y + 56, 16, 0, TAU); ctx.stroke();
        ctx.fillStyle = iconCol; ctx.beginPath(); ctx.arc(x + w / 2, y + 56, 6, 0, TAU); ctx.fill();
      }
      if (tag) txt(tag, x + w / 2, y + 92, 12, "#f0cf7a");
      txt(title, x + w / 2, y + (tag ? 122 : 116), 18, evo ? "#f0cf7a" : "#f4ead3", "center", true);
      txt(desc, x + w / 2, y + (tag ? 148 : 142), 13, "#9d9276");
      if (evo) txt("→ 换一副打法，五阶成型", x + w / 2, y + 172, 12, "#c8a44d");
      if (sel) txt("← 选它 →", x + w / 2, y + h - 14, 13, "#f0cf7a");
    }
    txt("当前：" + weaponLine(), W / 2, 344, 12, "#6d6552");
    txt("升到 5 阶再进化，一局可凑齐十六样", W / 2, 372, 12, "#6d6552");
  }

  if (g.state === "dead") {
    dim(0.9);
    txt("倒 在 半 路", W / 2, 146, 34, "#e05a4a", "center", true);
    txt(modeLine(), W / 2, 176, 13, "#9d9276");
    txt("撑了 " + fmtTime(g.t) + " · 砍了 " + g.kills + " 只 · 到 " + g.level + " 级", W / 2, 204, 15, "#f4ead3");
    txt(weaponLine(), W / 2, 236, 12, "#9d9276");
    if ((g.anim / 1.1) % 2 < 1) txt("按 回车 / 空格 回主菜单", W / 2, 300, 17, "#9ee08a", "center", true);
  }

  if (g.state === "win") {
    dim(0.86);
    txt("夜 路 到 头", W / 2, 146, 34, "#f0cf7a", "center", true);
    txt(modeLine(), W / 2, 176, 13, "#9d9276");
    txt("棺主躺下了 · " + fmtTime(g.t) + " · 砍了 " + g.kills + " 只 · " + g.level + " 级", W / 2, 204, 15, "#f4ead3");
    txt(weaponLine(), W / 2, 236, 12, "#9d9276");
    txt("想再走远些，回主菜单挑无尽", W / 2, 266, 13, "#c8a44d");
    if ((g.anim / 1.1) % 2 < 1) txt("按 回车 / 空格 回主菜单", W / 2, 308, 17, "#9ee08a", "center", true);
  }

  if (g.state === "pause") {
    dim(0.72);
    txt("歇 一 会", W / 2, 206, 30, "#f0cf7a", "center", true);
    txt(modeLine(), W / 2, 236, 13, "#9d9276");
    txt("Esc 接着走", W / 2, 266, 14, "#9d9276");
    txt("夜行圆球  v" + VER, W - 14, H - 12, 10, "#4f4736", "right");
  }
}

function fmtTime(t) {
  const sec = Math.floor(t);
  return Math.floor(sec / 60) + " 分 " + String(sec % 60).padStart(2, "0") + " 秒";
}
function modeLine() {
  const m = g.mode === "endless" ? "无尽 · 第 " + g.wave + " 波"
    : (g.diff === 2 ? "上路 · 噩梦" : g.diff === 1 ? "上路 · 困难" : "上路 · 普通");
  return m + " · " + g.mapName;
}
function weaponLine() {
  const list = [];
  for (let w = 0; w < WP_COUNT; w++) {
    if (!g.wown[w]) continue;
    list.push((g.wevo[w] ? WEVONAME[w] : WNAME[w]) + " Lv" + g.wlvl[w]);
  }
  return list.length ? list.join(" · ") : "只有剑光";
}

function pollPad() {
  if (!navigator.getGamepads) return;
  g.padX = 0; g.padY = 0;
  const pads = navigator.getGamepads();
  for (const pad of pads) {
    if (!pad) continue;
    const ax = pad.axes[0] || 0, ay = pad.axes[1] || 0;
    if (ax < -0.3) g.padX = -1; else if (ax > 0.3) g.padX = 1;
    if (ay < -0.3) g.padY = -1; else if (ay > 0.3) g.padY = 1;
    const dp = pad.buttons;
    if (dp[14] && dp[14].pressed) g.padX = -1;
    if (dp[15] && dp[15].pressed) g.padX = 1;
    if (dp[12] && dp[12].pressed) g.padY = -1;
    if (dp[13] && dp[13].pressed) g.padY = 1;
    if (dp[12] && dp[12].pressed && !g.padUpPrev) input.up = true;
    if (dp[13] && dp[13].pressed && !g.padDownPrev) input.down = true;
    g.padUpPrev = dp[12] && dp[12].pressed;
    g.padDownPrev = dp[13] && dp[13].pressed;
    const a = dp[0] && dp[0].pressed, b = dp[1] && dp[1].pressed;
    if (a && !g.padPrevA) { input.ok = true; audioInit(); }
    if (b && !g.padPrevB) { input.back = true; }
    g.padPrevA = a; g.padPrevB = b;
    break;
  }
}

function handleInput() {
  if (input.esc) {
    if (g.state === "play") g.state = "pause";
    else if (g.state === "pause") g.state = "play";
  }
  if (g.state === "title") {
    if (input.up) { g.menu = (g.menu + MENU.length - 1) % MENU.length; sfx("ui"); }
    if (input.down) { g.menu = (g.menu + 1) % MENU.length; sfx("ui"); }
    if (input.left) { g.mapSel = (g.mapSel + 3) % 4; sfx("ui"); }
    if (input.right) { g.mapSel = (g.mapSel + 1) % 4; sfx("ui"); }
    if (input.ok || input.back) newRun(MENU[g.menu]);
  } else if (g.state === "play") {
    // 无
  } else if (g.state === "level") {
    if (input.left) { g.chs = (g.chs + 2) % 3; sfx("ui"); }
    if (input.right) { g.chs = (g.chs + 1) % 3; sfx("ui"); }
    if (input.ok) pickCard();
  } else if (g.state === "dead" || g.state === "win") {
    if (input.ok) { g.state = "title"; g.bannerT = 0; }
  } else if (g.state === "pause") {
    if (input.ok) g.state = "play";
  }
  clearEdge();
}

const STEP = 1 / 60;
let acc = 0, lastT = performance.now();
function frame(now) {
  const dtRaw = (now - lastT) / 1000;
  lastT = now;
  const dt = Math.min(0.1, dtRaw);

  pollPad();
  handleInput();

  if (g.state === "play") {
    acc += dt;
    let steps = 0;
    while (acc >= STEP && steps < 6) { update(STEP); acc -= STEP; steps++; }
  } else {
    g.anim += dt;
    if (g.tipT > 0) g.tipT -= dt;
    if (g.flash > 0) g.flash = Math.max(0, g.flash - dt * 2.4);
    updateEffects(dt);
    acc = 0;
  }

  draw();
  requestAnimationFrame(frame);
}

(function boot() {
  genWorld(0);
  g.camx = Math.max(0, WT * TS / 2 - W / 2);
  g.camy = Math.max(0, HT * TS / 2 - H / 2);
  P.x = WT * TS / 2; P.y = HT * TS / 2;
  // 标题页背景放一个能看见的小场景
  requestAnimationFrame(frame);
})();

</script>
